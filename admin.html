let sidebarCloseTimer = null;

// Week/tab choices are view state, not studio data. Keep them per account in
// this browser so a refresh resumes where the teacher was without creating a
// database revision for every navigation tap.
function localViewKey() {
  return "cadence-view-v1:" + String(ME.email || ME.slug || "default").toLowerCase();
}
function persistLocalView() {
  if (!stateReady) return;
  try {
    localStorage.setItem(localViewKey(), JSON.stringify({
      tab: S.tab,
      week: S.week,
      scheduleView: S.scheduleView,
      hoursSort: S.hoursSort,
    }));
  } catch (e) { /* Browser storage unavailable — server state still remains safe. */ }
}
function restoreLocalView() {
  try {
    const view = JSON.parse(localStorage.getItem(localViewKey()) || "null");
    if (!view) return;
    if (["week", "replies", "plan", "hours"].includes(view.tab)) S.tab = view.tab;
    if (["timetable", "agenda"].includes(view.scheduleView)) S.scheduleView = view.scheduleView;
    if (["first", "surname", "allocated", "remaining"].includes(view.hoursSort)) S.hoursSort = view.hoursSort;
    const requestedWeek = Number(view.week);
    if (Number.isInteger(requestedWeek)) S.week = Math.max(1, Math.min(termWeeks(), requestedWeek));
    ensureRound(S.week);
  } catch (e) { /* Ignore malformed or unavailable local view state. */ }
}

// #app now holds three permanent containers rather than being wiped and
// rebuilt as one blob each render — this is what lets the header and
// (when unchanged) the week picker/subtabs bar stay perfectly still while
// only the content that actually differs between two screens slides.
// Comparing a hand-built template string directly against element.innerHTML
// is unreliable — the browser re-serializes HTML into its own canonical
// form when you read .innerHTML back (dropping redundant whitespace like
// the stray space left by an empty conditional attribute, for instance),
// so two semantically identical strings can compare as different. Parsing
// the fresh string through a throwaway element first puts both sides
// through the same normalization, so the comparison is apples to apples.
function ensureAppSkeleton() {
  const app = document.getElementById("app");
  if (!document.getElementById("appBody")) {
    app.innerHTML = '<div id="appHeader"></div><div id="appSubbar"></div><div id="appBody"></div>';
  }
}

// The "subbar" is whatever sits directly under the header and is often
// identical across several screens — the week picker (shared by Offer,
// Replies and Schedule) or the General/Priorities subtabs bar (shared by
// both Settings panels). Computed once, from current state, and reused by
// both render() and animatedRender()'s "did this actually change" check.
function computeSubbarHTML() {
  if (currentSection === "scheduler") {
    return S.tab === "hours" ? "" : '<div class="pad" style="padding-bottom:0">' + renderWeekPicker() + "</div>";
  }
  if (currentSection === "settings") {
    return '<div class="pad" style="padding-bottom:0"><div class="subtabs">' +
      '<button class="subtab' + (settingsTab === "general" ? " sel" : "") + '" data-action="settingsTab" data-tab="general">General</button>' +
      '<button class="subtab' + (settingsTab === "priorities" ? " sel" : "") + '" data-action="settingsTab" data-tab="priorities">Priorities</button>' +
      "</div></div>";
  }
  return "";
}

// What *kind* of subbar is showing, independent of which item within it is
// currently active. Comparing identity rather than raw HTML is what keeps
// the General/Priorities bar (and any subtabs added to Settings later)
// genuinely still when toggling between them — their HTML technically
// differs by a "sel" class each time, which a literal content diff would
// (correctly, but unhelpfully) treat as "changed" and slide. Identity says
// "still the same subtabs bar" regardless of which tab within it is lit up.
function computeSubbarIdentity() {
  if (currentSection === "scheduler") return S.tab === "hours" ? "none" : "weekpicker";
  if (currentSection === "settings") return "settings-subtabs";
  return "none";
}
let __subbarIdentity = "none";

let tabHighlightTimer = null;
function syncTabHighlight(tabName = S.tab, animate = false) {
  const tabs = document.querySelector("#appHeader .tabs");
  if (!tabs) return;
  const target = tabs.querySelector('[data-action="tab"][data-tab="' + tabName + '"]');
  const highlight = tabs.querySelector(".tab-highlight");
  if (!target || !highlight) return;

  clearTimeout(tabHighlightTimer);
  if (!animate) highlight.style.transition = "none";
  highlight.style.width = target.offsetWidth + "px";
  highlight.style.transform = "translateX(" + target.offsetLeft + "px)";
  tabs.classList.add("highlight-ready");
  if (!animate) {
    void highlight.offsetWidth;
    highlight.style.transition = "";
  }

  tabs.querySelectorAll('[data-action="tab"]').forEach(button => {
    button.setAttribute("aria-current", button === target ? "page" : "false");
  });
  const updateLabels = () => {
    tabs.querySelectorAll('[data-action="tab"]').forEach(button => button.classList.toggle("sel", button === target));
  };
  if (animate && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    tabHighlightTimer = setTimeout(updateLabels, 150);
  } else {
    updateLabels();
  }
}

function render(preserveHeader = false) {
  if (!stateReady) {
    document.getElementById("app").innerHTML = '<div class="pad"><p>Loading your saved schedule…</p></div>';
    return;
  }
  applyAccent(currentSection === "settings" ? settingsDraft.accent : S.settings.accent);
  ensureAppSkeleton();
  if (!preserveHeader) {
    document.getElementById("appHeader").innerHTML = renderHeader();
    syncTabHighlight(S.tab, false);
  }
  document.getElementById("appSubbar").innerHTML = computeSubbarHTML();
  __subbarIdentity = computeSubbarIdentity();
  const sections = {
    profile: renderProfileSection,
    students: renderStudentsSection,
    termdates: renderTermDatesSection,
    settings: renderSettingsBody,
  };
  document.getElementById("appBody").innerHTML = sections[currentSection] ? sections[currentSection]() : renderTabContent();
  mountAllGrids();
  mountPriorityList(document.getElementById("priorityList"));
  persistLocalView();
  scheduleSave();
}

// The scheduler header remains mounted during tab changes so its highlight
// can travel continuously; other header changes still update with the body.
// The subbar only
// slides along with the body when it's a genuinely different KIND of
// subbar on the other side of the transition — the same week picker or
// the same subtabs bar (whichever item within it is active) is left
// completely alone, exactly as asked.
async function animatedRender(direction) {
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  ensureAppSkeleton();
  const subbarEl = document.getElementById("appSubbar");
  const bodyEl = document.getElementById("appBody");
  const slidingSchedulerTab = currentSection === "scheduler" && !!document.querySelector("#appHeader .tabs");

  if (slidingSchedulerTab) syncTabHighlight(S.tab, true);

  if (!direction || reduceMotion || !bodyEl.firstChild) {
    render();
    return;
  }

  const subbarChanging = computeSubbarIdentity() !== __subbarIdentity;
  const targets = subbarChanging ? [subbarEl, bodyEl] : [bodyEl];
  const outX = direction > 0 ? "-22px" : "22px";
  const inX = direction > 0 ? "22px" : "-22px";

  targets.forEach((el) => {
    el.style.transition = "transform .2s ease, opacity .2s ease";
    el.style.transform = "translateX(" + outX + ")";
    el.style.opacity = "0";
  });
  await new Promise((r) => setTimeout(r, 200));

  // Keep the existing scheduler header alive while its single highlight
  // travels between tabs. Replacing it here would cut that transition off
  // halfway through even though the body animation correctly continues.
  render(slidingSchedulerTab);

  targets.forEach((el) => {
    el.style.transition = "none";
    el.style.transform = "translateX(" + inX + ")";
  });
  void bodyEl.offsetHeight; // force layout so the transition below starts from this position, not "auto"
  targets.forEach((el) => {
    el.style.transition = "transform .3s cubic-bezier(.22,.72,.16,1), opacity .3s ease";
    el.style.transform = "translateX(0)";
    el.style.opacity = "1";
  });
  await new Promise((r) => setTimeout(r, 300));
  targets.forEach((el) => {
    el.style.transition = "";
    el.style.transform = "";
    el.style.opacity = "";
  });
  if (slidingSchedulerTab) {
    document.getElementById("appHeader").innerHTML = renderHeader();
    syncTabHighlight(S.tab, false);
  }
}

// The panel and backdrop live outside #app's innerHTML churn deliberately —
// a freshly-created element has no "before" state, so a CSS transition on
// it never plays. Keeping them as stable elements and just toggling a
// class is what makes the slide and the dim actually animate.
function syncSidebarDOM() {
  const backdrop = document.getElementById("sidebarBackdrop");
  const panel = document.getElementById("sidebarPanel");
  if (!backdrop || !panel) return;
  panel.innerHTML = renderSidebarItems();
  clearTimeout(sidebarCloseTimer);
  if (sidebarOpen) {
    document.body.classList.add("sidebar-open");
    backdrop.hidden = false;
    void backdrop.offsetHeight; // force a layout pass so "open" transitions rather than snapping straight there
    backdrop.classList.add("open");
    panel.classList.add("open");
  } else {
    document.body.classList.remove("sidebar-open");
    backdrop.classList.remove("open");
    panel.classList.remove("open");
    sidebarCloseTimer = setTimeout(() => { backdrop.hidden = true; }, 580);
  }
}

function toggleSidebar() { sidebarOpen = !sidebarOpen; syncSidebarDOM(); }
function closeSidebar() { sidebarOpen = false; syncSidebarDOM(); }

async function signOut() {

  }
  window.location.href = "/login.html";
}

    '<div class="priority-list" id="priorityList">' + rows + '</div>' +
    '<div class="priority-section-title"><span>Excluded</span><span>' + excluded.length + '</span></div>' +
    '<div class="priority-list excluded">' + (excludedRows || '<div class="priority-row"><span class="priority-label"><strong>Nothing excluded</strong><span>Use Exclude above to remove a priority from scheduling.</span></span></div>') + '</div>';
}

function renderAccentPicker() {
  const selected = Object.prototype.hasOwnProperty.call(ACCENT_THEMES, settingsDraft.accent) ? settingsDraft.accent : "oxblood";
  return '<div class="panel"><h3>Accent colour</h3>' +
    '<p class="lede">Used for your studio and your students’ availability page. Choose a colour, then save changes.</p>' +
    '<div class="accent-picker" role="group" aria-label="Accent colour">' +
    Object.entries(ACCENT_THEMES).map(([id, theme]) =>
      '<button type="button" class="accent-option" data-action="setAccent" data-accent="' + id +
      '" aria-pressed="' + (id === selected) + '"><span class="accent-swatch" aria-hidden="true" style="background:' + theme.ink + '">' +
      (id === selected ? '✓' : '') + '</span><span>' + theme.name + '</span></button>'
    ).join('') + '</div></div>';
}

function renderGeneralSettingsTab() {
  const d = settingsDraft;
  const hourLabel = (h) => String(h).padStart(2, "0") + ":00";
  const rolling = d.schedulingMode === "rolling";
  return renderAccentPicker() + '<div class="panel">' +
      '<h3>Scheduling</h3>' +
      '<div class="choice-group">' +
      '<button class="choice-btn' + (!rolling ? " sel" : "") + '" data-action="setSchedulingMode" data-mode="terms">Term dates</button>' +
      '<button class="choice-btn' + (rolling ? " sel" : "") + '" data-action="setSchedulingMode" data-mode="rolling">Rolling weeks</button>' +
      '</div>' +
      '<p class="lede" style="margin:10px 0 0">' + (rolling
        ? "Weeks just keep counting up with no end date and no holiday jumps \u2014 use \u201cNot teaching this week\u201d for any breaks."
        : "Term dates set the teaching weeks and let the scheduler jump over holidays automatically.") + '</p>' +
    '</div>' +
    '<div class="panel">' +
      '<h3>Cancellations</h3>' +
      '<div class="field" style="margin-bottom:0"><label>Notice window</label><div class="stepper">' +
      '<button class="step" data-action="adjustCancellationWindow" data-delta="-6" ' + (Number(d.cancellationWindowHours) <= 6 ? "disabled" : "") + '>\u2013</button>' +
      "<b>" + Number(d.cancellationWindowHours || 24) + "h</b>" +
      '<button class="step" data-action="adjustCancellationWindow" data-delta="6" ' + (Number(d.cancellationWindowHours) >= 72 ? "disabled" : "") + '>+</button>' +
      "</div></div>" +
    '</div>' +
    '<div class="panel">' +
      '<h3>Availability grid</h3>' +
      '<p class="lede">Shapes the grid on the Offer tab, but only for weeks that are still completely blank. The moment you paint a block or mark a week as not teaching, that week\u2019s shape locks in for good, even if you change these again later.</p>' +
      '<div class="field"><label>Weekends</label>' +
      '<button class="btn' + (d.includeWeekends ? " notteaching-active" : "") + '" style="width:100%" data-action="toggleWeekendSetting">' +
      (d.includeWeekends ? "Weekends included. Tap to go back to weekdays only" : "Weekdays only. Tap to include Saturday and Sunday") + '</button></div>' +
      '<div class="field"><label>Grid starts at</label><div class="stepper">' +
      '<button class="step" data-action="adjustSettingsHour" data-which="start" data-delta="-1" ' + (d.dayStartHour <= 6 ? "disabled" : "") + '>\u2013</button>' +
      "<b>" + hourLabel(d.dayStartHour) + "</b>" +
      '<button class="step" data-action="adjustSettingsHour" data-which="start" data-delta="1" ' + (d.dayStartHour >= d.dayEndHour - 1 ? "disabled" : "") + '>+</button>' +
      "</div></div>" +
      '<div class="field" style="margin-bottom:0"><label>Grid ends at</label><div class="stepper">' +
      '<button class="step" data-action="adjustSettingsHour" data-which="end" data-delta="-1" ' + (d.dayEndHour <= d.dayStartHour + 1 ? "disabled" : "") + '>\u2013</button>' +
      "<b>" + hourLabel(d.dayEndHour) + "</b>" +
      '<button class="step" data-action="adjustSettingsHour" data-which="end" data-delta="1" ' + (d.dayEndHour >= 22 ? "disabled" : "") + '>+</button>' +
      "</div></div>" +
    '</div>';
}

function renderSettingsBody() {
  const body = settingsTab === "priorities" ? renderPrioritiesTab() : renderGeneralSettingsTab();
  return '<div class="pad" style="padding-top:0">' + body +
    '<div class="btnrow" style="margin-top:16px"><button class="btn sig" data-action="saveSettings">Save changes</button></div>' +
    "</div>";
}

function renderTabContent() {
  if (S.tab === "week") return renderOfferTab();
  if (S.tab === "replies") return renderRepliesTab();
  if (S.tab === "plan") return activeRound().plan ? renderLivePlanTab() : renderPreConfirmPlanTab();
  if (S.tab === "hours") return renderHoursTab();
  return "";
}

// The one and only week control. Type directly into the number to jump
// anywhere — including the very first time, to set where you're actually
// starting — or nudge with the arrows.
function renderWeekPicker() {
  const rnd = activeRound();
  const rolling = S.settings.schedulingMode === "rolling";
  return '<div class="weekpicker">' +
    '<button class="step" data-action="prevWeek" ' + (S.week <= 1 ? "disabled" : "") + '>\u2039</button>' +
    '<div class="weekpicker-mid"><label>Week <input type="number" inputmode="numeric" min="1" ' + (rolling ? "" : 'max="' + termWeeks() + '"') + ' data-bind="week" value="' + S.week + '">' + (rolling ? "" : " of " + termWeeks()) + '</label>' +
    '<span>' + (weekRangeLabel(rnd.weekStart) || "") + '</span></div>' +
    '<button class="step" data-action="nextWeek" ' + (!rolling && S.week >= termWeeks() ? "disabled" : "") + '>\u203a</button>' +
    "</div>";
}

function buildOfferActionsHTML(rnd) {
  const editing = '<div class="btnrow"><button class="btn sig" data-action="sendToStudents" ' +
    (rnd.offered.size && !rnd.notTeaching ? '' : 'disabled') + '>Lock &amp; copy link</button></div>' +
    '<div class="btnrow"><button class="btn" data-action="clearOffer">Clear grid</button>' +
    '<button class="btn' + (rnd.notTeaching ? " notteaching-active" : "") + '" data-action="skipWeek">Not teaching this week</button>' +
    '</div>';
  const locked = '<div class="btnrow"><button class="btn sig" data-action="copyStudentLink"' +
    (linkFeedback && linkFeedback.round === rnd && linkFeedback.pending ? ' disabled' : '') + '>Copy link</button></div>' +
    '<div class="btnrow"><button class="btn" data-action="editAvailability">Edit availability</button></div>';
  return '<div class="offer-actions" id="offerActions">' +
    '<div class="offer-mode' + (!rnd.sent ? ' active' : '') + '" data-mode="editing"' + (rnd.sent ? ' inert aria-hidden="true"' : '') + '>' + editing + '</div>' +
    '<div class="offer-mode' + (rnd.sent ? ' active' : '') + '" data-mode="locked"' + (!rnd.sent ? ' inert aria-hidden="true"' : '') + '>' + locked + '</div></div>' +
    '<div id="linkFeedback" class="link-feedback" role="status" aria-live="polite" aria-atomic="true">' + linkFeedbackHTML(rnd) + '</div>';
}

function renderOfferTab() {
  const rnd = activeRound();
  const hours = (rnd.offered.size * GRID_SLOT_MIN) / 60;
  const grid = buildGridHTML("offer", { selected: rnd.offered, offered: null, heat: null, days: roundDays(rnd), slots: roundSlots(rnd), startHour: rnd.dayStartHour });
  const gridBlock = rnd.notTeaching
    ? '<div class="grid-locked">Marked as not teaching this week.<br>Tap \u201cNot teaching this week\u201d again, or \u201cClear grid\u201d, to paint times.</div>'
    : '<div id="offerGrid"' + (rnd.sent ? ' class="offer-locked"' : "") + '>' + grid + "</div>";
  return '<div class="pad" style="padding-top:0">' +
    '<label class="dateline" style="margin-bottom:4px">Week beginning <input type="date" data-bind="weekStart" value="' + rnd.weekStart + '"></label>' +
    '<p style="font-size:13px;color:var(--ink-soft);margin:0 0 14px">' + (weekRangeLabel(rnd.weekStart) || "") + '. Check this matches the week you mean, and correct it if a reading week or anything else has thrown it off.</p>' +
    '<div class="dayprefs"><div class="dayprefs-head"><b>Teaching day preference</b><span>Tap to cycle Neutral → Preferred → Avoid</span></div>' +
    '<div class="dayprefs-grid" style="grid-template-columns:repeat(' + roundDays(rnd).length + ',minmax(0,1fr))">' + roundDays(rnd).map((d, i) => {
      const v = Number((rnd.dayPreferences && rnd.dayPreferences[i]) || 0);
      const cls = v === -1 ? " preferred" : v === 1 ? " avoid" : "";
      return '<button class="daypref' + cls + '" data-action="cycleDayPref" data-day="' + i + '"><strong>' + d + '</strong><span>' + preferenceLabel(v) + '</span></button>';
    }).join("") + '</div></div>' +
    '<div class="field"><label>Note for this week\u2019s message (optional)</label><input type="text" data-bind="weekNote" value="' + escapeHTML(rnd.note || "") + '" placeholder="e.g. half term next week"></div>' +
    '<p class="lede" style="margin-bottom:8px">Drag to paint the times you could teach this week. Students only ever see these.</p>' +
    '<p style="text-align:center;font-weight:700;font-size:15px;margin:0 0 8px">' + (weekRangeLabel(rnd.weekStart) || "") + '</p>' +
    gridBlock +
    '<p id="placementHelp" class="placement-help">After locking, choose Any, Early or Late for each block. Students still see your full availability.</p>' +
    '<div class="meter"><span>Offered this week</span><b>' + hours + 'h</b></div>' +
    buildOfferActionsHTML(rnd) +
    "</div>";
}

function renderRepliesTab() {
  const rnd = activeRound();
  if (rnd.notTeaching) {
    return '<div class="pad" style="padding-top:0"><p class="empty">This week is marked as not teaching, so there\u2019s nothing to collect. Undo it on the Offer tab if that\u2019s changed.</p></div>';
  }
  const heat = getHeat(rnd);
  let body;
  if (!rnd.offered.size) {
    body = '<p class="empty">Paint your blocks on the Offer tab first.</p>';
  } else {
    body = '<div class="panel">' + S.students.map(s => {
      const r = rnd.replies[s.id];
      const st = r ? r.status : "waiting";
      const isStudentReply = !!r && r.source !== "admin";
      const ownerText = !r ? "" : isStudentReply ? " (from the student)" : " (you entered this)";
      const validAvailCount = r && r.avail ? [...r.avail].filter(k => rnd.offered.has(k)).length : 0;
      const statusText = (st === "in" ? (validAvailCount + " slots free") : st === "skip" ? "Not this week" : st === "none" ? "Nothing works" : "Waiting") + ownerText;
      const canExpand = !isStudentReply || (st === "in" && validAvailCount > 0);
      const isExpanded = canExpand && S.openStudent === s.id;
      const curLesson = lessonMinutesFor(rnd, s.id);
      let lenrow = "";
      if (st === "in") {
        const dec = curLesson <= MIN_LESSON_MINUTES;
        const inc = curLesson >= MAX_LESSON_MINUTES || curLesson + SCHEDULE_SLOT_MIN > (s.allocated - taughtFor(s.id)) * 60;
        lenrow = '<div class="lenrow"><span>Lesson length</span><div class="stepper">' +
          '<button class="step" data-action="adjustLength" data-id="' + s.id + '" data-delta="-1" ' + (dec ? "disabled" : "") + ">–</button>" +
          "<b>" + curLesson + " min</b>" +
          '<button class="step" data-action="adjustLength" data-id="' + s.id + '" data-delta="1" ' + (inc ? "disabled" : "") + ">+</button>" +
          "</div></div>";
      }
      let gridBlock = "";
      if (isExpanded) {
        const avail = (r && r.avail) || new Set();
        gridBlock = isStudentReply
          ? '<div class="readonly-availability"><p class="readonly-note">Submitted availability · Read only</p>' +
            buildGridHTML("readonly", { selected: avail, offered: rnd.offered, studentId: s.id, days: roundDays(rnd), slots: roundSlots(rnd), startHour: rnd.dayStartHour }) + "</div>"
          : '<div style="padding:4px 0 14px">' + buildGridHTML("reply", { selected: avail, offered: rnd.offered, studentId: s.id, days: roundDays(rnd), slots: roundSlots(rnd), startHour: rnd.dayStartHour }) + "</div>";
      }
      const nameContent = "<strong>" + s.name + "</strong><span>" + statusText + "</span>" +
        (canExpand ? '<span class="reply-chevron" aria-hidden="true">⌄</span>' : "");
      const nameCell = canExpand
        ? '<button type="button" class="sname sname-toggle" data-action="toggleStudentOpen" data-id="' + s.id +
          '" aria-expanded="' + isExpanded + '">' + nameContent + "</button>"
        : '<div class="sname">' + nameContent + "</div>";
      return '<div class="srow-group">' +
        '<div class="srow">' + nameCell +
        '<div class="chips">' +
        '<button class="chip' + (st === "in" ? " sel" : "") + '" data-action="setStatus" data-id="' + s.id + '" data-status="in" ' + (isStudentReply ? "disabled" : "") + '>In</button>' +
        '<button class="chip' + (st === "skip" ? " sel grey" : "") + '" data-action="setStatus" data-id="' + s.id + '" data-status="skip" ' + (isStudentReply ? "disabled" : "") + '>Skip</button>' +
        '<button class="chip' + (st === "none" ? " sel warn" : "") + '" data-action="setStatus" data-id="' + s.id + '" data-status="none" ' + (isStudentReply ? "disabled" : "") + '>None</button>' +
        "</div></div>" + lenrow + gridBlock + "</div>";
    }).join("") + "</div>";
  }

  let heatPanel = "";
  if (rnd.offered.size > 0 && Object.keys(heat).length > 0) {
    heatPanel = '<div class="panel overlay-panel"><button type="button" class="overlay-toggle" data-action="toggleRepliesOverlay" aria-expanded="' + repliesOverlayOpen + '">' +
      '<strong>Everyone, overlaid</strong><span class="reply-chevron" aria-hidden="true">⌄</span></button>' +
      (repliesOverlayOpen ? '<div class="overlay-content">' + buildGridHTML("heat", { selected: new Set(), offered: rnd.offered, heat, days: roundDays(rnd), slots: roundSlots(rnd), startHour: rnd.dayStartHour }) + "</div>" : "") + "</div>";
  }

  const participants = getParticipants(rnd);
  const lede = rnd.offered.size
    ? '<p class="lede">Each student says whether they want a lesson, then paints inside your blocks. Tap a name to view their times; replies entered by you remain editable.</p>'
    : "";
  return '<div class="pad" style="padding-top:0">' +
    lede +
    (DEV_MODE ? '<div class="btnrow"><button class="btn sig" data-action="sampleReplies" ' + (rnd.offered.size ? "" : "disabled") + ">Load sample replies</button></div>" : "") +
    body + heatPanel +
    '<div class="btnrow"><button class="btn sig" data-action="runSolver" ' + (participants.length ? "" : "disabled") + ">Work out the schedule</button></div>" +
    "</div>";
}

function renderScheduleViewSwitch() {
  return '<div class="schedule-view-switch" role="group" aria-label="Schedule view">' +
    ["timetable", "agenda"].map(view => '<button type="button" data-action="setScheduleView" data-view="' + view +
      '" aria-pressed="' + (S.scheduleView === view) + '">' + (view === "agenda" ? "Agenda" : "Options") + '</button>').join("") + '</div>';
}

function agendaLessonColour(lesson) {
  // Stable across rearrangements, cancellations and weeks; independent of lesson status.
  let hash = 0;
  for (const character of String(lesson.id || lesson.name)) hash = (hash * 31 + character.charCodeAt(0)) >>> 0;
  return ["sand", "rose", "sage"][hash % 3];
}

function renderAgenda(assignments, weekNo, weekStart, startHour, confirmed) {
  const by = groupByDay(assignments);
  const count = assignments.length;
  const minutes = assignments.reduce((total, lesson) => total + lesson.lesson * SCHEDULE_SLOT_MIN, 0);
  const duration = minutes < 60 ? minutes + " min" : Math.floor(minutes / 60) + "h" + (minutes % 60 ? " " + minutes % 60 + " min" : "");
  const days = Object.keys(by).sort((a, b) => Number(a) - Number(b)).map(d => {
    const lessons = by[d];
    const rows = lessons.map(lesson => {
      const start = scheduleTimeFor(startHour, lesson.start);
      const end = scheduleTimeFor(startHour, lesson.start + lesson.lesson);
      const line = '<span class="agenda-name">' + escapeHTML(lesson.name) + '</span><span class="agenda-duration">' +
        (lesson.lesson * SCHEDULE_SLOT_MIN) + ' min</span>';
      // Dataset keys can contain student IDs: escape quotes as well as HTML markup.
      const lessonKey = escapeHTML(lesson.key || "").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
      const card = confirmed
        ? '<details class="agenda-lesson ' + agendaLessonColour(lesson) + '"><summary class="agenda-lesson-line">' + line + '</summary>' +
          '<div class="agenda-controls"><p>' + start + '–' + end + '</p><div class="cancels">' +
          '<button class="mini" data-action="cancelEarly" data-id="' + lessonKey + '">Cancelled, ' + (S.settings.cancellationWindowHours || 24) + 'h+ notice</button>' +
          '<button class="mini warnb" data-action="cancelLate" data-id="' + lessonKey + '">Cancelled late</button></div></div></details>'
        : '<div class="agenda-lesson ' + agendaLessonColour(lesson) + '"><div class="agenda-lesson-line">' + line + '</div></div>';
      return '<div class="agenda-row"><time class="agenda-time" datetime="' + start + '">' + start + '</time>' + card + '</div>';
    }).join("");
    return '<section class="agenda-day"><div class="agenda-day-heading"><h3>' + escapeHTML(dayDateLong(weekStart, Number(d))) +
      '</h3><span>' + lessons.length + ' lesson' + (lessons.length === 1 ? '' : 's') + '</span></div>' + rows + '</section>';
  }).join("");
  return '<section class="agenda" aria-label="Weekly lesson agenda"><div class="agenda-head">' +
    '<div class="agenda-heading"><h2>Your week</h2><span class="agenda-week">Week ' + escapeHTML(weekNo) + '</span></div>' +
    '<p>' + count + ' lesson' + (count === 1 ? '' : 's') + ' · ' + duration +
    ' teaching · ' + (confirmed ? 'Confirmed' : 'Draft arrangement') + '</p></div><div class="agenda-body">' +
    (days || '<p class="empty">No lessons scheduled.</p>') +
    '<p class="agenda-foot"><span class="agenda-dot" aria-hidden="true"></span>' +
    (confirmed ? (count ? 'Your confirmed week. Tap a lesson to manage cancellations.' : 'Cancelled lessons are listed below.') : 'A preview of your selected arrangement. Confirm when you’re ready.') +
    '</p></div></section>';
}

function renderAgendaOptionPicker(result, rnd) {
  const days = roundDays(rnd);
  return '<label class="agenda-choice">Arrangement<select data-bind="agendaOption">' + result.options.map((option, index) => {
    const dayLabel = [...new Set(option.assign.map(a => a.d))].sort((a, b) => a - b).map(d => days[d]).join(" + ");
    const gaps = option.gaps ? (option.gaps * SCHEDULE_SLOT_MIN) + ' min idle' : 'no gaps';
    return '<option value="' + index + '"' + (index === rnd.chosen ? ' selected' : '') + '>Option ' + (index + 1) + ' · ' +
      escapeHTML(dayLabel) + ' · ' + gaps + '</option>';
  }).join("") + '</select></label>';
}

function renderPreConfirmPlanTab() {
  const rnd = activeRound();
  if (!rnd.result) {
    return '<div class="pad" style="padding-top:0"><p class="empty">Nothing solved yet. Collect replies, then tap “Work out the schedule”.</p></div>';
  }
  const r = rnd.result;
  let intro;
  if (r.ok) {
    const days = r.options[0].days;
    intro = '<p class="lede">Everyone fits across <b style="color:var(--ink)">' + days + " day" + (days > 1 ? "s" : "") + "</b>. Pick an arrangement.</p>";
  } else {
    intro = '<p class="lede">Can’t fit everyone.' + (r.unplaced.length ? " Left out: " + r.unplaced.join(", ") + "." : "") + "</p>";
  }

  const days = roundDays(rnd);
  const renderOption = (opt) => {
    const actualIdx = r.options.indexOf(opt);
    const dayNums = [...new Set(opt.assign.map(a => a.d))].sort();
    const daysLabel = dayNums.map(d => days[d]).join(" + ");
    const gapsLabel = opt.gaps === 0 ? "no gaps" : ((opt.gaps * SCHEDULE_SLOT_MIN) / 60) + "h idle";
    const prefValues = dayNums.map(d => Number((rnd.dayPreferences && rnd.dayPreferences[d]) || 0));
    const allPreferred = prefValues.length && prefValues.every(v => v === -1);
    const hasAvoid = prefValues.some(v => v === 1);
    const prefText = allPreferred
      ? '<span class="prefgood">★ Preferred day' + (dayNums.length > 1 ? "s" : "") + '</span>'
      : hasAvoid
        ? '<span class="prefavoid">Includes an avoided day</span>'
        : 'Neutral day preference';
    const lines = opt.assign.slice().sort((a, b) => a.d - b.d || a.start - b.start).map(a =>
      '<div class="line"><span>' + days[a.d] + " " + scheduleTimeFor(rnd.dayStartHour, a.start) + "–" + scheduleTimeFor(rnd.dayStartHour, a.start + a.lesson) + "</span><span>" + a.name + "</span></div>"
    ).join("");
    return '<div class="opt' + (actualIdx === rnd.chosen ? " sel" : "") + '" data-action="chooseOption" data-idx="' + actualIdx + '">' +
      '<div class="opthead"><b>' + daysLabel + "</b><span>" + gapsLabel + "</span></div>" + lines +
      '<div class="option-reason">' + prefText + ', ' + opt.days + ' teaching day' + (opt.days === 1 ? "" : "s") + '</div></div>';
  };

  const optionsHTML = r.options.slice(0, 3).map(renderOption).join("");
  const extraOptionsHTML = r.options.slice(3).map(renderOption).join("");

  const moreOptionsHTML = r.options.length > 3
    ? '<div id="moreOptionsExpander" class="more-options-expander' + (rnd.optionsExpanded ? " open" : "") + '">' +
        '<div class="more-options-expander-inner">' + extraOptionsHTML + '</div>' +
      '</div>' +
      '<div class="btnrow more-options"><button class="btn" data-action="toggleMoreOptions" aria-expanded="' +
        (rnd.optionsExpanded ? "true" : "false") + '">' +
        (rnd.optionsExpanded ? "Show fewer options" : "Show more options (" + (r.options.length - 3) + ")") +
      "</button></div>"
    : "";

  const alreadyOneDay = r.options.length > 0 && r.options[0].days <= 1;
  const blockersHTML = alreadyOneDay ? "" : '<div class="panel"><h3>If you want it down to one day</h3>' + r.blockers.map(b =>
    '<div class="blocker"><b>' + b.day + "</b> " + (b.blocked.length === 0 ? '<span class="clear">works for everyone</span>' : "works for everyone except " + b.blocked.join(", ")) + "</div>"
  ).join("") + "</div>";

  let sharePanel = "", confirmBtn = "";
  if (r.options.length > 0) {
    sharePanel = '<div class="panel"><h3>Post it to the group</h3>' +
      '<label class="dateline">Week beginning <input type="date" data-bind="weekStart" value="' + rnd.weekStart + '"></label>' +
      '<div class="btnrow" style="margin:12px 0 0">' +
      '<button class="btn" data-action="copyChosen">Copy as text</button>' +
      '<button class="btn" data-action="imageChosen">Make an image</button></div>' +
      (S.fallbackText ? '<textarea class="fallback" readonly rows="' + (S.fallbackText.split("\n").length + 1) + '" onfocus="this.select()">' + escapeHTML(S.fallbackText) + "</textarea>" : "") +
      (S.imgUrl ? '<div class="imgwrap"><img src="' + S.imgUrl + '" alt="Schedule card"><a class="btn" href="' + S.imgUrl + '" download="lessons-week-' + S.week + '.png">Save image</a></div>' : "") +
      "</div>";
    confirmBtn = '<div class="btnrow"><button class="btn sig" data-action="confirmSchedule">Confirm schedule</button></div>';
  }

  const selected = r.options[rnd.chosen];
  const agendaMode = S.scheduleView === "agenda" && selected;
  const arrangement = agendaMode
    ? renderAgendaOptionPicker(r, rnd) + renderAgenda(selected.assign, S.week, rnd.weekStart, rnd.dayStartHour, false)
    : optionsHTML + moreOptionsHTML;
  return '<div class="pad" style="padding-top:0">' + (selected ? renderScheduleViewSwitch() : "") + intro + arrangement + blockersHTML + sharePanel + confirmBtn + "</div>";
}

function renderLivePlanTab() {
  const rnd = activeRound();
  const plan = rnd.plan;
  const live = plan.lessons.filter(l => l.status === "planned");
  const cancelled = plan.lessons.filter(l => l.status !== "planned");
  const freed = plan.lessons.filter(l => l.status === "cancelled_early");
  const by = groupByDay(live);

  const intro = '<p class="lede">Week ' + plan.weekNo + " is live. " + live.length + " lesson" + (live.length === 1 ? "" : "s") +
    " standing" + (cancelled.length > 0 ? ", " + cancelled.length + " cancelled" : "") + ".</p>";

  const dayPanels = Object.keys(by).sort().map(d => {
    const lessons = by[d].map(l =>
      '<div class="live"><div class="livetop"><b>' + l.name.split(" ")[0] + "</b><span>" + scheduleTimeFor(rnd.dayStartHour, l.start) + "–" + scheduleTimeFor(rnd.dayStartHour, l.start + l.lesson) + "</span></div>" +
      '<div class="cancels"><button class="mini" data-action="cancelEarly" data-id="' + l.key + '">Cancelled, ' + (S.settings.cancellationWindowHours || 24) + 'h+ notice</button>' +
      '<button class="mini warnb" data-action="cancelLate" data-id="' + l.key + '">Cancelled late</button></div></div>'
    ).join("");
    return '<div class="panel"><h3>' + dayDateLong(plan.weekStart, +d) + "</h3>" + lessons + "</div>";
  }).join("");

  const emptyMsg = live.length === 0 ? '<p class="empty">Every lesson this week has been cancelled.</p>' : "";

  let cancelledPanel = "";
  if (cancelled.length > 0) {
    const days = roundDays(rnd);
    cancelledPanel = '<div class="panel"><h3>Cancelled</h3>' + cancelled.map(l =>
      '<div class="entry"><span class="struck">' + days[l.d] + " " + scheduleTimeFor(rnd.dayStartHour, l.start) + " · " + l.name.split(" ")[0] +
      '<i class="tag">' + (l.status === "cancelled_late" ? "charged" : "slot freed") + "</i></span>" +
      '<button class="x" data-action="uncancel" data-id="' + l.key + '">↺</button></div>'
    ).join("") + "</div>";
  }

  const actionRow = '<div class="btnrow">' +
    (freed.length > 0 ? '<button class="btn sig" data-action="closeGaps">Close the gaps</button>' : "") +
    '<button class="btn" data-action="copyLive" ' + (live.length ? "" : "disabled") + ">Copy as text</button>" +
    '<button class="btn" data-action="imageLive" ' + (live.length ? "" : "disabled") + ">Make an image</button>" +
    '<button class="btn" data-action="undoConfirmSchedule">Undo confirmation</button></div>';

  const fallback = S.fallbackText ? '<textarea class="fallback" readonly rows="' + (S.fallbackText.split("\n").length + 1) + '" onfocus="this.select()">' + escapeHTML(S.fallbackText) + "</textarea>" : "";
  const imgBlock = S.imgUrl ? '<div class="imgwrap"><img src="' + S.imgUrl + '" alt="Schedule card"><a class="btn" href="' + S.imgUrl + '" download="lessons-week-' + plan.weekNo + '.png">Save image</a></div>' : "";
  const endRow = '<div class="btnrow"><button class="btn sig" data-action="endWeek">End week and log hours</button></div>';

  const schedule = S.scheduleView === "agenda"
    ? renderAgenda(live, plan.weekNo, plan.weekStart, rnd.dayStartHour, true)
    : dayPanels + emptyMsg;
  return '<div class="pad" style="padding-top:0">' + renderScheduleViewSwitch() + intro + schedule + cancelledPanel + actionRow + fallback + imgBlock + endRow + "</div>";
}

function renderHoursTab() {
  const rolling = S.settings.schedulingMode === "rolling";
  const weeksLeft = Math.max(1, termWeeks() - S.weeksCompleted);
  const totalTaught = S.students.reduce((s, x) => s + taughtFor(x.id), 0);
  const totalScheduled = S.students.reduce((s, x) => s + scheduledFor(x.id), 0);
  const totalAllocated = S.students.reduce((s, x) => s + x.allocated, 0);

  const firstName = (name) => (name || "").trim().split(/\s+/)[0] || "";
  const surname = (name) => {
    const parts = (name || "").trim().split(/\s+/);
    return parts.length > 1 ? parts[parts.length - 1] : parts[0] || "";
  };

  const sortedStudents = S.students.slice().sort((a, b) => {
    const sort = S.hoursSort || "first";
    if (sort === "surname") {
      return surname(a.name).localeCompare(surname(b.name), "en", { sensitivity: "base" }) ||
        firstName(a.name).localeCompare(firstName(b.name), "en", { sensitivity: "base" });
    }
    if (sort === "allocated") {
      return (Number(b.allocated) || 0) - (Number(a.allocated) || 0) ||
        firstName(a.name).localeCompare(firstName(b.name), "en", { sensitivity: "base" });
    }
    if (sort === "remaining") {
      const aRemaining = (Number(a.allocated) || 0) - taughtFor(a.id);
      const bRemaining = (Number(b.allocated) || 0) - taughtFor(b.id);
      return bRemaining - aRemaining ||
        firstName(a.name).localeCompare(firstName(b.name), "en", { sensitivity: "base" });
    }
    return firstName(a.name).localeCompare(firstName(b.name), "en", { sensitivity: "base" }) ||
      surname(a.name).localeCompare(surname(b.name), "en", { sensitivity: "base" });
  });

  const rows = sortedStudents.map(s => {
    const taught = taughtFor(s.id);
    const scheduledLessons = scheduledLessonsFor(s.id);
    const scheduled = scheduledLessons.reduce((sum, item) => sum + (item.lesson.lesson * SCHEDULE_SLOT_MIN) / 60, 0);
    const remaining = s.allocated - taught;
    const perWeek = remaining / weeksLeft;
    const behind = !rolling && perWeek > 1.05;
    const allocation = Number(s.allocated) || 0;
    const pct = allocation > 0 ? Math.min(100, Math.max(0, (taught / allocation) * 100)) : 0;
    const scheduledEndPct = allocation > 0 ? Math.min(100, Math.max(pct, ((taught + scheduled) / allocation) * 100)) : 0;
    const scheduledPct = Math.max(0, scheduledEndPct - pct);
    const lessonsLeft = Math.max(1, Math.round(remaining));
    const entries = S.log.filter(e => e.studentId === s.id).sort((a, b) => (a.date < b.date ? 1 : -1));
    const manualDate = manualDateDrafts[s.id] || "";
    const manualEntryOpen = manualEntryOpenId === s.id;
    const open = S.openHours === s.id;

    const note = remaining <= 0 ? "Allocation complete"
      : behind ? "Needs " + perWeek.toFixed(1) + "h a week to finish in time"
      : remaining + "h left, roughly " + lessonsLeft + " more hour-long lesson" + (lessonsLeft === 1 ? "" : "s");

    let ledger = "";
    {
      const scheduledRows = scheduledLessons.length === 0
        ? '<div class="ledger-empty">No lessons currently scheduled</div>'
        : scheduledLessons.map(item => {
          const l = item.lesson;
          const hours = (l.lesson * SCHEDULE_SLOT_MIN) / 60;
          const statusTag = l.status === "cancelled_late" ? "Late cancellation" : "Scheduled";
          return '<div class="scheduled-entry"><div class="scheduled-entry-main"><strong>' +
            dayDateLong(item.plan.weekStart, l.d) + '</strong><span>' +
            scheduleTimeFor(item.startHour, l.start) + '–' + scheduleTimeFor(item.startHour, l.start + l.lesson) +
            ' · Week ' + escapeHTML(item.plan.weekNo) + '<i class="tag">' + statusTag + '</i></span></div>' +
            '<span class="scheduled-entry-hours">' + compactHours(hours) + 'h</span></div>';
        }).join("");
      const entryRows = entries.length === 0 ? '<div class="ledger-empty">No completed hours yet</div>' :
        entries.map(e => {
          if (editingEntryId === e.id) {
            return '<div class="entry"><input type="date" data-bind="editDate" value="' + editDraft.date + '" style="flex:1;margin-right:6px">' +
              '<select data-bind="editHours" style="margin-right:6px">' + [0.5, 1, 1.5, 2, 2.5, 3].map(h =>
                '<option value="' + h + '" ' + (parseFloat(editDraft.hours) === h ? "selected" : "") + ">" + h + "h</option>").join("") + "</select>" +
              '<span class="entryright"><button class="btn" style="padding:5px 10px;font-size:12.5px" data-action="saveEditEntry" data-id="' + e.id + '">Save</button>' +
              '<button class="x" data-action="cancelEditEntry">×</button></span></div>';
          }
          return '<div class="entry"><span>' + fmtDateShort(e.date) +
            (e.manual ? '<i class="tag">by hand</i>' : "") + (e.lateCancel ? '<i class="tag">late cancel</i>' : "") + "</span>" +
            '<span class="entryright">' + e.hours + 'h<button class="x" data-action="editEntry" data-id="' + e.id + '" title="Edit">\u270E</button>' +
            '<button class="x" data-action="removeEntry" data-id="' + e.id + '">×</button></span></div>';
        }).join("");
      ledger = '<div class="hours-detail-expander' + (open ? ' open' : '') + '" data-hours-detail="' + s.id +
        '" aria-hidden="' + (!open) + '"' + (open ? '' : ' inert') + '>' +
        '<div class="hours-detail-expander-inner"><div class="ledger"><section class="scheduled-hours"><div class="ledger-heading"><span>Scheduled</span><span>' +
        compactHours(scheduled) + 'h</span></div>' + scheduledRows +
        '<p class="scheduled-note">These hours will move to completed when you end the week.</p></section>' +
        '<div class="ledger-heading"><span>Completed hours</span><span>' + compactHours(taught) + 'h</span></div>' + entryRows +
        '<button type="button" class="btn manual-entry-toggle" data-action="toggleManualEntry" data-id="' + s.id +
        '" aria-expanded="' + manualEntryOpen + '">' + (manualEntryOpen ? 'Cancel manual entry' : '+ Add hours manually') + '</button>' +
        '<div class="manual-entry-expander' + (manualEntryOpen ? ' open' : '') + '" data-manual-entry="' + s.id + '">' +
        '<div class="manual-entry-expander-inner"><div class="addrow"><div class="manual-date-field' + (manualDate ? '' : ' empty') + '"><span>' +
        (manualDate ? fmtDateShort(manualDate) : 'Select date') + '</span><input type="date" data-bind="draftDate" data-id="' + s.id + '" value="' +
        manualDate + '" aria-label="Select date for manual teaching hours" required></div>' +
        '<select data-bind="draftHours">' + [0.5, 1, 1.5, 2, 2.5, 3].map(h =>
          '<option value="' + h + '" ' + (parseFloat(S.draft.hours) === h ? "selected" : "") + ">" + h + "h</option>").join("") + "</select>" +
        '<button class="btn" data-action="addEntry" data-id="' + s.id + '">Add</button></div></div></div></div></div></div>';
    }

    return '<div class="hrow"><div class="htop" style="cursor:pointer" data-action="toggleHoursOpen" data-id="' + s.id +
      '" role="button" tabindex="0" aria-expanded="' + open + '">' +
      "<b>" + s.name + "</b><em>" + taught + " / " + s.allocated + "h</em></div>" +
      '<div class="track">' + (scheduledPct > 0 ? '<div class="fill scheduled combined-end" style="left:' + pct + '%;width:' + scheduledPct + '%"></div>' : '') +
      '<div class="fill' + (behind ? " behind" : "") + (scheduledPct > 0 ? "" : " combined-end") + '" style="width:' + pct + '%"></div></div>' +
      '<div class="hours-breakdown">' + compactHours(taught) + 'h taught' + (scheduled > 0 ? ' · ' + compactHours(scheduled) + 'h scheduled' : '') + '</div>' +
      '<div class="hnote' + (behind ? " warn" : "") + '">' + note + "</div>" + ledger + "</div>";
  }).join("");

  const exportOptions = [
    ["week", "This week"],
    ["month", "This month"],
    ["term", "This term"],
    ["year", "This year"],
  ].filter(([val]) => val !== "term" || !rolling);
  const exportPanel = '<div class="hours-sort" style="flex-direction:column;align-items:stretch;gap:10px">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px">' +
    '<label for="hoursExportSelect">Export hours for</label>' +
    '<select id="hoursExportSelect" data-bind="hoursExportTimeframe">' +
    exportOptions.map(([val, label]) => '<option value="' + val + '" ' + ((S.hoursExportTimeframe || "week") === val ? "selected" : "") + '>' + label + '</option>').join("") +
    '</select></div>' +
    '<button class="btn sig" data-action="exportHours">Copy summary</button>' +
    (S.hoursExportText ? '<textarea class="fallback" readonly rows="' + (S.hoursExportText.split("\n").length + 1) + '" onfocus="this.select()">' + escapeHTML(S.hoursExportText) + "</textarea>" : "") +
    "</div>";

  return '<div class="pad"><p class="lede">' + compactHours(totalTaught) + "h taught" +
    (totalScheduled > 0 ? " · " + compactHours(totalScheduled) + "h scheduled" : "") + " of " + totalAllocated + "h allocated" +
    (rolling ? "" : ", with " + weeksLeft + " weeks left") + '. Tap a name to see scheduled and completed lessons.</p>' +
    '<div class="hours-legend" aria-label="Hours progress legend"><span><i class="hours-key" aria-hidden="true"></i>Taught</span>' +
    '<span><i class="hours-key scheduled" aria-hidden="true"></i>Scheduled</span></div>' +
    '<div class="hours-sort"><label for="hoursSort">Sort by</label><select id="hoursSort" data-bind="hoursSort">' +
      '<option value="first" ' + ((S.hoursSort || "first") === "first" ? "selected" : "") + '>First name</option>' +
      '<option value="surname" ' + (S.hoursSort === "surname" ? "selected" : "") + '>Surname</option>' +
      '<option value="allocated" ' + (S.hoursSort === "allocated" ? "selected" : "") + '>Hours Allocated</option>' +
      '<option value="remaining" ' + (S.hoursSort === "remaining" ? "selected" : "") + '>Hours Remaining</option>' +
    '</select></div>' +
    '<div class="panel">' + rows + "</div>" +
    exportPanel +
    '<div class="btnrow"><button class="btn' + (confirmingReset ? " confirm-pending" : "") + '" data-action="resetYearConfirm">' +
    (confirmingReset ? "Tap again to confirm" : "Reset year") + '</button></div></div>';
}

/* ================================================================== */
/*  Delegated event handling                                           */
/* ================================================================== */

document.getElementById("app").addEventListener("pointerdown", (e) => {
  const input = e.target.closest('.manual-date-field input[type="date"]');
  if (!input) return;
  // Let Safari perform its normal trusted input click. This guard only stops
  // the native picker's focus transition from triggering a DOM refresh.
  suppressStateRefreshUntil = Date.now() + 2000;
});

document.getElementById("app").addEventListener("click", (e) => {
  if (!stateReady || stateBlocked) return;
  if (offerTransitionBusy && e.target.closest("#offerActions")) return;
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;

  if (action === "tab") {
    if (confirmingReset) { confirmingReset = false; clearTimeout(resetConfirmTimer); }
    const tabOrder = ["week", "replies", "plan", "hours"];
    const fromIdx = tabOrder.indexOf(S.tab);
    const toIdx = tabOrder.indexOf(el.dataset.tab);
    S.tab = el.dataset.tab;
    animatedRender(toIdx >= fromIdx ? 1 : -1);
  }
  else if (action === "setScheduleView") {
    if (!["timetable", "agenda"].includes(el.dataset.view)) return;
    S.scheduleView = el.dataset.view;
    render();
    const selected = document.querySelector('[data-action="setScheduleView"][aria-pressed="true"]');
    if (selected) selected.focus({ preventScroll: true });
  }
  else if (action === "clearOffer") clearOffer();
  else if (action === "skipWeek") skipWeek();
  else if (action === "prevWeek") prevWeek();
  else if (action === "nextWeek") nextWeek();
  else if (action === "sendToStudents") sendToStudents();
  else if (action === "copyStudentLink") copyStudentLink();
  else if (action === "editAvailability") editAvailability();
  else if (action === "cycleDayPref") cycleDayPreference(Number(el.dataset.day));
  else if (action === "toggleMoreOptions") toggleMoreOptions();
  else if (action === "toggleSidebar") toggleSidebar();
  else if (action === "saveProfile") saveProfile();
  else if (action === "requestDeleteAccount") { confirmingDeleteAccount = true; render(); }
  else if (action === "cancelDeleteAccount") { confirmingDeleteAccount = false; render(); }
  else if (action === "confirmDeleteAccount") deleteAccount();
  else if (action === "addStudent") addStudent();
  else if (action === "removeStudent") removeStudent(id);
  else if (action === "saveTermDates") saveTermDates();
  else if (action === "switchToTermsFromTermDates") switchToTermsFromTermDates();
  else if (action === "toggleWeekendSetting") toggleWeekendSetting();
  else if (action === "setSchedulingMode") setSchedulingMode(el.dataset.mode);
  else if (action === "adjustCancellationWindow") adjustCancellationWindow(Number(el.dataset.delta));
  else if (action === "adjustSettingsHour") adjustSettingsHour(el.dataset.which, Number(el.dataset.delta));
  else if (action === "excludePriority") excludePriority(el.dataset.key);
  else if (action === "includePriority") includePriority(el.dataset.key);
  else if (action === "setAccent") {
    if (!Object.prototype.hasOwnProperty.call(ACCENT_THEMES, el.dataset.accent)) return;
    settingsDraft.accent = el.dataset.accent;
    render();
    const selected = document.querySelector('[data-action="setAccent"][aria-pressed="true"]');
    if (selected) selected.focus({ preventScroll: true });
  }
  else if (action === "saveSettings") saveSettings();
  else if (action === "settingsTab") {
    const order = ["general", "priorities"];
    const dir = order.indexOf(el.dataset.tab) >= order.indexOf(settingsTab) ? 1 : -1;
    settingsTab = el.dataset.tab;
    animatedRender(dir);
  }
  else if (action === "sampleReplies") sampleReplies();
  else if (action === "toggleStudentOpen") {
    S.openStudent = S.openStudent === id ? null : id;
    render();
  }
  else if (action === "toggleRepliesOverlay") {
    repliesOverlayOpen = !repliesOverlayOpen;
    render();
  }
  else if (action === "setStatus") {
    const rnd = activeRound();
    const status = el.dataset.status;
    const existing = rnd.replies[id];

    // Student-submitted replies are read-only in admin.
    if (existing && existing.source !== "admin") return;

    // Tapping the currently active status again clears the admin-entered reply.
    if (existing && existing.status === status) {
      delete rnd.replies[id];
      if (S.openStudent === id) S.openStudent = null;
    } else {
      const prevLesson = lessonFor(rnd, id);
      rnd.replies[id] = {
        status,
        avail: (existing && existing.avail) || new Set(),
        lessonMinutes: prevLesson * SCHEDULE_SLOT_MIN,
        source: "admin",
      };
      if (status === "in") S.openStudent = id;
      else if (S.openStudent === id) S.openStudent = null;
    }

    rnd.result = null;
    render();
  }
  else if (action === "adjustLength") adjustLength(id, Number(el.dataset.delta));
  else if (action === "runSolver") runSolver();
  else if (action === "chooseOption") { activeRound().chosen = Number(el.dataset.idx); render(); }
  else if (action === "copyChosen") { const rnd = activeRound(); doCopy(rnd.result.options[rnd.chosen].assign, S.week, rnd.weekStart, rnd.dayStartHour, rnd.note); }
  else if (action === "imageChosen") { const rnd = activeRound(); doImage(rnd.result.options[rnd.chosen].assign, S.week, rnd.weekStart, S.week, rnd.dayStartHour, rnd.note); }
  else if (action === "confirmSchedule") confirmSchedule();
  else if (action === "undoConfirmSchedule") undoConfirmSchedule();
  else if (action === "cancelEarly") setLessonStatus(id, "cancelled_early");
  else if (action === "cancelLate") setLessonStatus(id, "cancelled_late");
  else if (action === "uncancel") setLessonStatus(id, "planned");
  else if (action === "closeGaps") rescheduleWeek();
  else if (action === "copyLive") { const rnd = activeRound(); doCopy(rnd.plan.lessons.filter(l => l.status === "planned"), rnd.plan.weekNo, rnd.plan.weekStart, rnd.dayStartHour, rnd.note); }
  else if (action === "imageLive") { const rnd = activeRound(); doImage(rnd.plan.lessons.filter(l => l.status === "planned"), rnd.plan.weekNo, rnd.plan.weekStart, rnd.plan.weekNo, rnd.dayStartHour, rnd.note); }
  else if (action === "endWeek") endWeek();
  else if (action === "toggleHoursOpen") {
    toggleHoursPanel(id, el);
  }
  else if (action === "removeEntry") removeEntry(id);
  else if (action === "editEntry") startEditEntry(id);
  else if (action === "saveEditEntry") saveEditEntry(id);
  else if (action === "cancelEditEntry") cancelEditEntry();
  else if (action === "toggleManualEntry") toggleManualEntry(id, el);
  else if (action === "addEntry") addEntry(id, el);
  else if (action === "resetYearConfirm") handleResetClick();
  else if (action === "exportHours") exportHours();
});

document.getElementById("app").addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const row = e.target.closest('[data-action="toggleHoursOpen"]');
  if (!row) return;
  e.preventDefault();
  toggleHoursPanel(row.dataset.id, row);
});

document.getElementById("app").addEventListener("change", (e) => {
  if (!stateReady || stateBlocked) return;
  const el = e.target.closest("[data-bind]");
  if (!el) return;
  const bind = el.dataset.bind;
  if (bind === "blockPlacement") {
    const rnd = activeRound();
    if (!rnd.sent || rnd.plan || !["any", "early", "late"].includes(el.value)) return;
    const block = reconcileBlockPreferences(rnd).find(b => b.d === Number(el.dataset.blockDay) && b.start === Number(el.dataset.blockStart));
    if (!block) return;
    block.placement = el.value;
    rnd.result = null; rnd.chosen = 0; rnd.optionsExpanded = false;
    S.imgUrl = ""; S.fallbackText = "";
    // Update in place so keyboard focus and the native mobile picker survive.
    const pill = el.closest('.placement-pill');
    pill.classList.toggle('chosen', el.value !== 'any');
    pill.querySelector('span:not(.placement-prefix)').textContent = ({any:'Any',early:'Early',late:'Late'})[el.value] + ' ⌄';
    scheduleSave();
  }
  else if (bind === "weekStart") { activeRound().weekStart = el.value; S.imgUrl = ""; S.fallbackText = ""; render(); }
  else if (bind === "agendaOption") {
    const rnd = activeRound();
    const chosen = Number(el.value);
    if (!Number.isInteger(chosen) || !rnd.result || !rnd.result.options[chosen]) return;
    rnd.chosen = chosen;
    S.imgUrl = ""; S.fallbackText = "";
    // Dismiss the native picker before replacing the select. Refocusing
    // its replacement can reopen the picker on iOS Safari.
    el.blur();
    render();
  }
  else if (bind === "week") {
    let n = parseInt(el.value, 10);
    if (!isFinite(n)) n = S.week;
    S.week = Math.max(1, Math.min(termWeeks(), n));
    ensureRound(S.week);
    S.imgUrl = ""; S.fallbackText = "";
    render();
  }
  else if (bind === "hoursSort") { S.hoursSort = el.value; render(); }
  else if (bind === "hoursExportTimeframe") { S.hoursExportTimeframe = el.value; S.hoursExportText = ""; render(); }
  else if (bind === "weekNote") { activeRound().note = el.value; render(); }
  else if (bind === "draftDate") {
    manualDateDrafts[el.dataset.id] = el.value;
    // Never rebuild the DOM from a native date-picker event: Safari may emit
    // an initial change while opening, and replacing the focused input closes
    // the picker. Update only the visible proxy text around the same input.
    const field = el.closest(".manual-date-field");
    if (field) {
      field.classList.toggle("empty", !el.value);
      const label = field.querySelector("span");
      if (label) label.textContent = el.value ? fmtDateShort(el.value) : "Select date";
    }
  }
  else if (bind === "draftHours") { S.draft.hours = el.value; }
  else if (bind === "editDate") { editDraft.date = el.value; }
  else if (bind === "editHours") { editDraft.hours = el.value; }
  else if (bind === "profileName") { ME.name = el.value; }
  else if (bind === "profileInstrument") { ME.instrument = el.value; }
  else if (bind === "studentName") {
    const s = S.students.find(x => x.id === el.dataset.id);
    if (s) s.name = el.value;
  }
  else if (bind === "studentHours") {
    const s = S.students.find(x => x.id === el.dataset.id);
    if (s) s.allocated = Number(el.value) || 0;
  }
  else if (bind === "newStudentName") { newStudentDraft.name = el.value; }
  else if (bind === "newStudentAllocated") { newStudentDraft.allocated = el.value; }
  else if (bind === "termCount") { setTermCount(parseInt(el.value, 10)); }
  else if (bind === "termStart") { termDraft.ranges[Number(el.dataset.idx)].start = el.value; }
  else if (bind === "termEnd") { termDraft.ranges[Number(el.dataset.idx)].end = el.value; }
  scheduleSave();
});

/* ================================================================== */
/*  Boot                                                               */
/* ================================================================== */

document.getElementById("sidebarBackdrop").addEventListener("click", closeSidebar);
document.getElementById("sidebarPanel").addEventListener("click", (e) => {
  const signOutBtn = e.target.closest('[data-sidebar-action="signOut"]');
  if (signOutBtn) { signOut(); return; }

  const btn = e.target.closest("[data-section]");
  if (btn) goSection(btn.dataset.section);
});
syncSidebarDOM();
window.addEventListener("pagehide", persistLocalView);
window.addEventListener("resize", () => syncTabHighlight(S.tab, false));

render();
Promise.all([loadState(), loadMe()]).then(() => {
  restoreLocalView();
  render();
});
</script>
</body>
</html>
