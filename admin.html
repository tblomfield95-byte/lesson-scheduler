<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lesson Scheduler</title>
<style>
  html,body{margin:0;padding:0}
  body{
    --ink:#1B2430; --ink-soft:#5A6675; --paper:#FBFAF8; --panel:#FFFFFF;
    --rule:#DDD8CE; --sig:#832222; --sig-soft:#F0DEDE; --warn:#B45309; --warn-soft:#F7E8D2;
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-feature-settings:"tnum" 1;
    background:var(--paper); color:var(--ink);
    min-height:100vh; padding-bottom:80px;
  }
  *{box-sizing:border-box}
  body{overflow-x:hidden}
  #app{
    min-height:100vh;
    transform:scale(1);
    transform-origin:50% 50vh;
    border-radius:0;
    transition:
      transform .58s cubic-bezier(.22,.72,.16,1),
      border-radius .58s cubic-bezier(.22,.72,.16,1),
      box-shadow .58s cubic-bezier(.22,.72,.16,1);
    will-change:transform;
  }
  body.sidebar-open #app{
    transform:scale(.955);
    border-radius:18px;
    box-shadow:0 18px 46px rgba(27,36,48,.18);
    overflow:hidden;
  }
  .bar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
  .bartop{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:14px 16px 8px}
  .hbrow{display:flex;align-items:center;gap:10px;min-width:0}
  .hamburger{font-size:19px;line-height:1;background:none;border:none;color:var(--ink);
             cursor:pointer;padding:2px 2px 2px 0;flex:none}
  .hamburger:focus-visible{outline:2px solid var(--sig);outline-offset:2px}
  .sidebar-backdrop{position:fixed;inset:0;background:rgba(27,36,48,0);z-index:60;
                     opacity:0;pointer-events:none;transition:opacity .48s ease, background-color .48s ease}
  .sidebar-backdrop.open{opacity:1;background:rgba(27,36,48,.45);pointer-events:auto}
  .sidebar-panel{position:fixed;top:0;left:0;bottom:0;width:230px;max-width:80vw;background:var(--panel);
                 z-index:61;box-shadow:2px 0 16px rgba(0,0,0,.18);padding:18px 0;overflow-y:auto;
                 transform:translateX(-100%);transition:transform .58s cubic-bezier(.22,.72,.16,1)}
  .sidebar-panel.open{transform:translateX(0)}
  .sidebar-head{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);
                padding:2px 18px 14px}
  .sidebar-item{display:block;width:100%;text-align:left;font:inherit;font-size:15px;padding:12px 18px;
                border:none;background:none;color:var(--ink);cursor:pointer}
  .sidebar-item.sel{background:var(--sig-soft);color:var(--sig);font-weight:600}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:13px;color:var(--ink-soft);margin:0 0 5px}
  .field input{width:100%;font:inherit;font-size:15px;padding:11px 13px;border-radius:9px;
               border:1px solid var(--rule);background:var(--panel);color:var(--ink)}
  .title{font-size:15.5px;font-weight:640;letter-spacing:-0.01em;margin:0}
  .wk{font-size:13px;color:var(--ink-soft);white-space:nowrap}
  .tabs{display:flex;gap:2px;padding:0 12px 10px;overflow-x:auto}
  .tab{flex:1;min-width:74px;border:none;background:none;padding:7px 6px;font:inherit;font-size:13px;
       color:var(--ink-soft);border-radius:7px;cursor:pointer;white-space:nowrap}
  .tab.sel{background:var(--ink);color:var(--paper);font-weight:560}
  .tab:focus-visible{outline:2px solid var(--sig);outline-offset:2px}
  .pad{padding:16px}
  .lede{font-size:14px;line-height:1.5;color:var(--ink-soft);margin:0 0 14px}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .btn{font:inherit;font-size:13px;padding:9px 14px;border-radius:8px;border:1px solid var(--rule);
       background:var(--panel);color:var(--ink);cursor:pointer}
  .btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:560}
  .btn.sig{background:var(--sig);color:#fff;border-color:var(--sig);font-weight:560}
  .btn.confirm-pending{background:var(--warn);color:#fff;border-color:var(--warn);font-weight:560;
                        animation:confirmPulse 0.35s ease}
  @keyframes confirmPulse{0%{transform:scale(1)}35%{transform:scale(1.07)}65%{transform:scale(0.97)}100%{transform:scale(1)}}
  .btn.notteaching-active{background:var(--sig-soft);border-color:var(--sig);color:var(--sig);font-weight:560}
  .btn:disabled{opacity:.4;cursor:default}
  .btn:focus-visible{outline:2px solid var(--sig);outline-offset:2px}

  .weekpicker{display:flex;align-items:center;justify-content:space-between;gap:10px;
              padding:10px 12px;margin-bottom:14px;border:1px solid var(--rule);border-radius:10px;background:var(--panel)}
  .weekpicker-mid{text-align:center;flex:1;min-width:0}
  .weekpicker-mid label{display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:600}
  .weekpicker-mid input{font:inherit;font-size:14px;font-weight:600;width:36px;text-align:center;
                         padding:3px 2px;border-radius:6px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);
                         -moz-appearance:textfield}
  .weekpicker-mid input::-webkit-outer-spin-button,
  .weekpicker-mid input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .weekpicker-mid span{display:block;font-size:12px;color:var(--ink-soft);margin-top:2px}

  .grid-wrap{border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--panel);
             touch-action:none;user-select:none;-webkit-user-select:none}
  .grid-head{display:flex;border-bottom:1px solid var(--rule);background:var(--paper)}
  .dayhead{flex:1;text-align:center;padding:8px 0;font-size:12px;font-weight:600;color:var(--ink-soft)}
  .gutter{width:46px;flex:none}
  .row{display:flex;height:25px}
  .row .time{font-size:10.5px;color:var(--ink-soft);padding-right:6px;text-align:right;
             line-height:25px;border-right:1px solid var(--rule)}
  .cell{flex:1;border-right:1px solid #EFECE6;border-bottom:1px solid #EFECE6;
        position:relative;cursor:pointer}
  .cell:last-child{border-right:none}
  .cell.on{background:var(--sig)}
  .cell.muted{background:repeating-linear-gradient(45deg,#F6F4F0,#F6F4F0 4px,#FFF 4px,#FFF 8px);cursor:default}
  .cell.heat{background:var(--sig)}
  .heatnum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
           font-size:10px;color:#fff;font-weight:600;pointer-events:none}
  .grid-locked{border:1px solid var(--rule);border-radius:10px;
               background:repeating-linear-gradient(45deg,#F6F4F0,#F6F4F0 8px,#FBFAF8 8px,#FBFAF8 16px);
               padding:36px 16px;text-align:center;color:var(--ink-soft);font-size:13.5px;line-height:1.5}

  .meter{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 0;
         font-size:13px;color:var(--ink-soft)}
  .meter b{font-size:22px;color:var(--ink);font-weight:640;letter-spacing:-0.02em}

  .srow-group{border-bottom:1px solid var(--rule)}
  .srow-group:last-child{border-bottom:none}
  .srow{display:flex;align-items:center;gap:10px;padding:11px 0}
  .sname{flex:1;min-width:0}
  .sname strong{display:block;font-size:14.5px;font-weight:580}
  .sname span{font-size:12px;color:var(--ink-soft)}
  .chips{display:flex;gap:4px}
  .chip{font:inherit;font-size:11.5px;padding:5px 8px;border-radius:20px;border:1px solid var(--rule);
        background:var(--panel);color:var(--ink-soft);cursor:pointer}
  .chip.sel{background:var(--sig);border-color:var(--sig);color:#fff;font-weight:560}
  .chip.sel.grey{background:var(--ink-soft);border-color:var(--ink-soft)}
  .chip.sel.warn{background:var(--warn);border-color:var(--warn)}

  .lenrow{display:flex;align-items:center;justify-content:space-between;
          padding:0 0 11px;
          font-size:12.5px;color:var(--ink-soft)}
  .stepper{display:flex;align-items:center;gap:10px}
  .stepper b{font-size:13px;font-weight:600;color:var(--ink);min-width:58px;text-align:center}
  .step{font:inherit;font-size:16px;line-height:1;width:28px;height:28px;border-radius:14px;
        border:1px solid var(--rule);background:var(--panel);color:var(--ink);cursor:pointer}
  .step:disabled{opacity:.32;cursor:default}
  .step:focus-visible{outline:2px solid var(--sig);outline-offset:2px}

  .panel{border:1px solid var(--rule);border-radius:10px;background:var(--panel);padding:14px;margin-bottom:12px}
  .panel h3{margin:0 0 10px;font-size:14px;font-weight:620}
  .opt{border:1px solid var(--rule);border-radius:9px;padding:12px;margin-bottom:8px;cursor:pointer;background:var(--panel)}
  .opt.sel{border-color:var(--sig);box-shadow:inset 0 0 0 1px var(--sig)}
  .opthead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .opthead b{font-size:14px}
  .opthead span{font-size:12px;color:var(--ink-soft)}
  .line{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}
  .line span:first-child{color:var(--ink-soft)}

  .blocker{font-size:13px;line-height:1.55;padding:6px 0;border-bottom:1px solid var(--rule)}
  .blocker:last-child{border-bottom:none}
  .blocker b{font-weight:600}
  .clear{color:var(--sig);font-weight:560}

  .hrow{padding:11px 0;border-bottom:1px solid var(--rule)}
  .hrow:last-child{border-bottom:none}
  .htop{display:flex;justify-content:space-between;align-items:baseline;font-size:14px}
  .htop b{font-weight:580}
  .htop em{font-style:normal;font-size:12.5px;color:var(--ink-soft)}
  .track{height:6px;background:#EDEAE4;border-radius:3px;margin:7px 0 5px;overflow:hidden}
  .fill{height:100%;background:var(--sig)}
  .fill.behind{background:var(--warn)}
  .hnote{font-size:12px;color:var(--ink-soft)}
  .hnote.warn{color:var(--warn)}

  .dateline{display:flex;align-items:center;justify-content:space-between;gap:12px;
            font-size:13px;color:var(--ink-soft)}
  .dateline input{font:inherit;font-size:13.5px;padding:7px 9px;border-radius:7px;
                  border:1px solid var(--rule);background:var(--paper);color:var(--ink)}
  .dateline input[type="number"]{width:40px;text-align:center;-moz-appearance:textfield}
  .dateline input[type="number"]::-webkit-outer-spin-button,
  .dateline input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .fallback{width:100%;margin-top:12px;font:inherit;font-size:13px;line-height:1.5;
            padding:10px;border-radius:8px;border:1px solid var(--rule);
            background:var(--paper);color:var(--ink);resize:vertical}
  .imgwrap{margin-top:12px}
  .imgwrap img{width:100%;border:1px solid var(--rule);border-radius:9px;display:block;margin-bottom:10px}

  .ledger{margin-top:10px;padding:10px 12px;background:var(--paper);
          border:1px solid var(--rule);border-radius:8px}
  .entry{display:flex;justify-content:space-between;align-items:center;
         font-size:13px;padding:12px 0;border-bottom:1px solid var(--rule)}
  .entry:last-child{border-bottom:none}
  .entry input{font:inherit;font-size:14px;padding:9px 11px;border-radius:8px;
               border:1px solid var(--rule);background:var(--panel);color:var(--ink)}
  .entry.faint{color:var(--ink-soft);border-bottom:none;padding-bottom:10px}
  .entryright{display:flex;align-items:center;gap:8px}
  .tag{font-style:normal;font-size:11px;color:var(--ink-soft);margin-left:8px;
       border:1px solid var(--rule);border-radius:10px;padding:1px 6px}
  .x{font:inherit;font-size:17px;line-height:1;width:28px;height:28px;border-radius:14px;
     border:1px solid var(--rule);background:var(--panel);color:var(--ink-soft);cursor:pointer;flex:none}
  .x:focus-visible{outline:2px solid var(--sig);outline-offset:2px}
  .addrow{display:flex;gap:8px;align-items:center;padding-top:12px;border-top:1px solid var(--rule)}
  .addrow input,.addrow select{font:inherit;font-size:13px;padding:9px 11px;border-radius:8px;
          border:1px solid var(--rule);background:var(--panel);color:var(--ink);min-width:0}
  .addrow input{flex:1}
  .addrow .btn{padding:9px 14px;flex:none}

  .term-group{border:1px solid var(--rule);border-radius:10px;padding:14px;margin-bottom:16px;background:var(--panel)}
  .term-group h4{margin:0 0 12px;font-size:14px;font-weight:620;color:var(--ink)}
  .term-dates{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .term-dates .field{margin-bottom:0}
  .term-dates .field label{font-size:12px;margin:0 0 4px}
  .term-dates .field input{font-size:14px;padding:9px 11px}

  .live{padding:9px 0;border-bottom:1px solid var(--rule)}
  .live:last-child{border-bottom:none}
  .livetop{display:flex;justify-content:space-between;align-items:baseline;font-size:14.5px}
  .livetop b{font-weight:600}
  .livetop span{color:var(--ink-soft);font-size:13px}
  .cancels{display:flex;gap:6px;margin-top:7px}
  .mini{font:inherit;font-size:11.5px;padding:5px 9px;border-radius:16px;
        border:1px solid var(--rule);background:var(--paper);color:var(--ink-soft);cursor:pointer}
  .mini.warnb{color:var(--warn);border-color:#E7CDBE}
  .mini:focus-visible{outline:2px solid var(--sig);outline-offset:2px}
  .struck{text-decoration:line-through;color:var(--ink-soft)}

  .toast{position:fixed;left:16px;right:16px;bottom:18px;background:var(--ink);color:var(--paper);
         padding:12px 14px;border-radius:9px;font-size:13.5px;z-index:50;opacity:0}
  .toast.show{animation:toastFade 2.6s ease-in-out both}
  @keyframes toastFade{0%{opacity:0}12%{opacity:1}82%{opacity:1}100%{opacity:0}}
  .empty{font-size:13.5px;color:var(--ink-soft);line-height:1.55;padding:20px 0}
</style>
</head>
<body>
<div id="app"></div>
<div id="sidebarBackdrop" class="sidebar-backdrop" hidden></div>
<div id="sidebarPanel" class="sidebar-panel"></div>
<div id="toast" class="toast" hidden></div>
