  .tabs{display:flex;gap:2px;padding:0 12px 10px;overflow-x:auto}
  .tab{flex:1;min-width:74px;border:none;background:none;padding:7px 6px;font:inherit;font-size:13px;

  .tab.sel{background:var(--ink);color:var(--paper);font-weight:560}

  .pad{padding:16px}
  .lede{font-size:14px;line-height:1.5;color:var(--ink-soft);margin:0 0 14px}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}

  .weekpicker{display:flex;align-items:center;justify-content:space-between;gap:10px;

  .weekpicker-mid{text-align:center;flex:1;min-width:0}

  .grid-wrap{border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--panel);
             touch-action:none;user-select:none;-webkit-user-select:none}
  .grid-head{display:flex;border-bottom:1px solid var(--rule);background:var(--paper)}
  .dayhead{flex:1;text-align:center;padding:8px 0;font-size:12px;font-weight:600;color:var(--ink-soft)}

  .row{display:flex;height:25px}

        border:1px solid var(--rule);background:var(--paper);color:var(--ink-soft);cursor:pointer}

<body>
<div id="app"></div>
<div id="sidebarBackdrop" class="sidebar-backdrop" hidden></div>
<div id="sidebarPanel" class="sidebar-panel"></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ================================================================== */
/*  Constants                                                          */
/* ================================================================== */

const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri"];
const START_HOUR = 9;
const SLOT_MIN = 30;
const SLOTS = 20; // 09:00 -> 19:00

const slotTime = (i) => {
  const total = START_HOUR * 60 + i * SLOT_MIN;
  const h = Math.floor(total / 60);
  const m = total % 60;
  return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
};

const key = (d, i) => d + "-" + i;

const todayISO = () => { const n = new Date(); return new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate())).toISOString().slice(0, 10); };

// A sensible starting point for a brand-new account before onboarding (or
// the Term Dates screen) sets the real ones. Editable per-teacher from
// here on — nothing below treats term dates as fixed any more.
const DEFAULT_TERM_RANGES = [
  { start: "2026-09-14", end: "2026-12-04" },
  { start: "2027-01-04", end: "2027-03-19" },
  { start: "2027-04-12", end: "2027-07-02" },
];

// The teaching-week total is derived from S.termRanges (raw calendar weeks
// across every term), not a fixed number — reading weeks reduce it the
// same way any "not teaching" week does, by being marked, not by a
// separate deduction baked into a constant.
function termWeeks() {
  let total = 0;
  (S.termRanges || []).forEach(t => {
    if (!t.start || !t.end) return;
    const days = (new Date(t.end + "T00:00:00") - new Date(t.start + "T00:00:00")) / 86400000;
    if (days >= 0) total += Math.ceil((days + 1) / 7);
  });
  return Math.max(1, total);
}

// Parses a plain "YYYY-MM-DD" into its UTC calendar components. Building
// dates via new Date(iso + "T00:00:00") and reading them back with
// .toISOString() is the classic trap here: the first half is local time,
// the second is always UTC, and in any positive-UTC-offset timezone (BST
// included) that silently loses a day on every round trip. Working in
// Date.UTC(...) throughout sidesteps the mismatch entirely.
function isoParts(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return { y, m, d };
}

function nextWeekStart(iso) {
  const { y, m, d } = isoParts(iso);
  const naiveISO = new Date(Date.UTC(y, m - 1, d + 7)).toISOString().slice(0, 10);
  const term = (S.termRanges || []).find(t => iso >= t.start && iso <= t.end);
  if (!term) return naiveISO; // outside any known term — just roll forward
  if (naiveISO > term.end) {
    const next = S.termRanges[S.termRanges.indexOf(term) + 1];
    return next ? next.start : naiveISO; // jump the gap, or fall back at year end
  }
  return naiveISO;
}

function weekRangeLabel(iso) {
  if (!iso) return "";
  const { y, m, d } = isoParts(iso);
  const mon = new Date(Date.UTC(y, m - 1, d));
  const fri = new Date(Date.UTC(y, m - 1, d + 4));
  const sameMonth = mon.getUTCMonth() === fri.getUTCMonth() && mon.getUTCFullYear() === fri.getUTCFullYear();
  const monMonth = mon.toLocaleDateString("en-GB", { month: "short", timeZone: "UTC" });
  const friMonth = fri.toLocaleDateString("en-GB", { month: "short", timeZone: "UTC" });
  return sameMonth
    ? mon.getUTCDate() + "\u2013" + fri.getUTCDate() + " " + friMonth + " " + fri.getUTCFullYear()
    : mon.getUTCDate() + " " + monMonth + " \u2013 " + fri.getUTCDate() + " " + friMonth + " " + fri.getUTCFullYear();
}

function escapeHTML(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/* ================================================================== */
/*  Deterministic pseudo-random, so "sample replies" is repeatable     */
/* ================================================================== */

function mulberry(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const hashStr = (s) => {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
};

/* ================================================================== */
/*  Solver (unchanged logic — pure functions, no framework dependency) */
/* ================================================================== */

const bitCount = (n) => { let c = 0; while (n) { n &= n - 1; c++; } return c; };

function buildCandidates(participants, offered) {
  return participants.map((p) => {
    const cands = [];
    for (let d = 0; d < DAYS.length; d++) {
      for (let i = 0; i + p.lesson <= SLOTS; i++) {
        let ok = true;
        for (let k = 0; k < p.lesson; k++) {
          const kk = key(d, i + k);
          if (!offered.has(kk) || !p.avail.has(kk)) { ok = false; break; }
        }
        if (ok) cands.push({ d, start: i });
      }
    }
    return { ...p, cands };
  });
}

function scoreSolution(assign) {
  const byDay = {};
  assign.forEach((a) => { (byDay[a.d] = byDay[a.d] || []).push(a); });
  let gaps = 0, latest = 0;
  Object.values(byDay).forEach((list) => {
    list.sort((x, y) => x.start - y.start);
    const first = list[0].start;
    const last = list[list.length - 1].start + list[list.length - 1].lesson;
    const busy = list.reduce((s, x) => s + x.lesson, 0);
    gaps += last - first - busy;
    latest = Math.max(latest, last);
  });
  return { days: Object.keys(byDay).length, gaps, latest };
}

function combinations(arr, k) {
  const out = [];
  const rec = (start, acc) => {
    if (out.length > 40) return;
    if (acc.length === k) { out.push(acc.slice()); return; }
    for (let i = start; i < arr.length; i++) { acc.push(arr[i]); rec(i + 1, acc); acc.pop(); }
  };
  rec(0, []);
  return out;
}

function dayBlockers(withCands, offered) {
  return DAYS.map((label, d) => {
    const dayWasOffered = [...offered].some((k) => Number(k.split("-")[0]) === d);
    if (!dayWasOffered) return null; // nothing to negotiate — you never offered this day
    const blocked = withCands.filter((p) => !p.cands.some((c) => c.d === d)).map((p) => p.name);
    return { day: label, blocked };
  }).filter(Boolean).sort((a, b) => a.blocked.length - b.blocked.length);
}

function solve(participants, offered) {
  const withCands = buildCandidates(participants, offered);

  const masks = [];
  for (let m = 1; m < 1 << DAYS.length; m++) masks.push(m);
  masks.sort((a, b) => bitCount(a) - bitCount(b) || a - b);

  const tryMask = (mask, people) => {
    const pool = people
      .map((p) => ({ ...p, cands: p.cands.filter((c) => mask & (1 << c.d)) }))
      .sort((a, b) => a.cands.length - b.cands.length);
    if (pool.some((p) => p.cands.length === 0)) return [];

    const found = [];
    const occupied = new Set();
    let nodes = 0;

    const place = (idx, acc) => {
      if (found.length >= 240 || nodes > 60000) return;
      nodes++;
      if (idx === pool.length) { found.push(acc.slice()); return; }
      const p = pool[idx];
      for (const c of p.cands) {
        let clash = false;
        for (let k = 0; k < p.lesson; k++) {
          if (occupied.has(key(c.d, c.start + k))) { clash = true; break; }
        }
        if (clash) continue;
        for (let k = 0; k < p.lesson; k++) occupied.add(key(c.d, c.start + k));
        acc.push({ id: p.id, name: p.name, d: c.d, start: c.start, lesson: p.lesson });
        place(idx + 1, acc);
        acc.pop();
        for (let k = 0; k < p.lesson; k++) occupied.delete(key(c.d, c.start + k));
      }
    };
    place(0, []);
    return found;
  };

  const rankAndDedupe = (found) => {
    const scored = found.map((a) => ({ assign: a, ...scoreSolution(a) }))
      .sort((x, y) => x.gaps - y.gaps || x.latest - y.latest);
    const seen = new Set(); const uniq = [];
    for (const s of scored) {
      const sig = s.assign.map((a) => a.id + ":" + a.d + ":" + a.start).sort().join("|");
      if (seen.has(sig)) continue;
      seen.add(sig); uniq.push(s);
      if (uniq.length === 3) break;
    }
    return uniq;
  };

  const impossible = withCands.some((p) => p.cands.length === 0);
  if (!impossible) {
    for (const mask of masks) {
      const found = tryMask(mask, withCands);
      if (found.length) {
        return { ok: true, options: rankAndDedupe(found), unplaced: [], blockers: dayBlockers(withCands, offered) };
      }
    }
  }

  let best = null;
  for (const mask of masks) {
    for (let drop = 1; drop <= withCands.length && !best; drop++) {
      const subsets = combinations(withCands, withCands.length - drop);
      for (const people of subsets) {
        if (people.some((p) => p.cands.filter((c) => mask & (1 << c.d)).length === 0)) continue;
        const found = tryMask(mask, people);
        if (found.length) {
          const placedIds = new Set(people.map((p) => p.id));
          best = {
            ok: false,
            options: rankAndDedupe(found).slice(0, 2),
            unplaced: withCands.filter((p) => !placedIds.has(p.id)).map((p) => p.name),
            blockers: dayBlockers(withCands, offered),
          };
          break;
        }
      }
      if (best) break;
    }
    if (best) break;
  }

  return best || { ok: false, options: [], unplaced: withCands.map((p) => p.name), blockers: dayBlockers(withCands, offered) };
}

// Who's logged in — fetched once from /api/me, never synced back as part
// of the app state (that stays purely the studio data, not the account).
let ME = { name: "", instrument: "", slug: "", email: "" };
async function loadMe() {

    if (res.status === 401) { window.location.href = "/login.html"; return; }
    if (res.ok) ME = await res.json();

function blankRound(weekStart) {
  return { weekStart, offered: new Set(), replies: {}, plan: null, result: null, chosen: 0, notTeaching: false };
}

let S = {
  tab: "week",
  week: 1,
  weeksCompleted: 0,
  termRanges: DEFAULT_TERM_RANGES.map(r => ({ ...r })),
  rounds: { "1": blankRound(DEFAULT_TERM_RANGES[0].start) },
  students: [],
  openStudent: null,
  log: [],
  openHours: null,
  draft: { date: todayISO(), hours: 1 },
  fallbackText: "",
  imgUrl: "",
};

function ensureRound(weekNo) {
  const k = String(weekNo);
  if (S.rounds[k]) return S.rounds[k];
  let fromWeek = 1;
  let fromStart = S.termRanges[0].start;
  for (let w = weekNo - 1; w >= 1; w--) {
    if (S.rounds[String(w)]) { fromWeek = w; fromStart = S.rounds[String(w)].weekStart; break; }
  }
  let cur = fromStart;
  for (let w = fromWeek; w < weekNo; w++) cur = nextWeekStart(cur);
  S.rounds[k] = blankRound(cur);
  return S.rounds[k];
}
function activeRound() { return ensureRound(S.week); }
const lessonFor = (rnd, id) => (rnd.replies[id] && rnd.replies[id].lesson) || 2;

/* ================================================================== */
/*  Persistence — one JSON blob synced to D1 via a Pages Function      */
/* ================================================================== */

const DEV_MODE = false; // shows the "Load sample replies" button while testing solo

function serializeState() {
  const rounds = {};
  Object.keys(S.rounds).forEach(k => {
    const rr = S.rounds[k];
    rounds[k] = {
      weekStart: rr.weekStart,
      offered: [...rr.offered],
      replies: Object.fromEntries(Object.entries(rr.replies).map(([id, rep]) => [id, { status: rep.status, avail: [...rep.avail], lesson: rep.lesson || 2 }])),
      plan: rr.plan,
      result: rr.result,
      chosen: rr.chosen,
      notTeaching: !!rr.notTeaching,
    };
  });
  return JSON.stringify({
    tab: S.tab,
    week: S.week,
    weeksCompleted: S.weeksCompleted,
    termRanges: S.termRanges,
    rounds,
    students: S.students,
    log: S.log,
    draft: S.draft,
  });
}

function applySavedState(saved) {
  if (!saved) return;
  S.tab = saved.tab || S.tab;
  S.week = saved.week || S.week;
  S.weeksCompleted = saved.weeksCompleted || 0;
  S.termRanges = (saved.termRanges && saved.termRanges.length) ? saved.termRanges : S.termRanges;
  S.students = saved.students || S.students;
  S.log = saved.log || [];
  S.draft = saved.draft || S.draft;
  S.rounds = {};
  Object.entries(saved.rounds || {}).forEach(([k, rr]) => {
    S.rounds[k] = {
      weekStart: rr.weekStart,
      offered: new Set(rr.offered || []),
      replies: Object.fromEntries(Object.entries(rr.replies || {}).map(([id, rep]) => [id, { status: rep.status, avail: new Set(rep.avail || []), lesson: rep.lesson || 2 }])),
      plan: rr.plan || null,
      result: rr.result || null,
      chosen: rr.chosen || 0,
      notTeaching: !!rr.notTeaching,
    };
  });
  ensureRound(S.week);
}

let saveTimer = null;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    fetch("/api/state", { method: "POST", headers: { "content-type": "application/json" }, body: serializeState() })
      .catch(() => { /* offline or backend not deployed yet — next change retries */ });
  }, 500);
}

async function loadState() {
  try {
    const res = await fetch("/api/state");
    if (res.status === 401) { window.location.href = "/login.html"; return; }
    if (!res.ok) return;
    const saved = await res.json();
    applySavedState(saved);
  } catch (e) { /* no backend yet, or offline — start from in-page defaults */ }
}

const taughtFor = (id) => S.log.filter(e => e.studentId === id).reduce((s, e) => s + e.hours, 0);
const getParticipants = (rnd) => S.students
  .filter(s => rnd.replies[s.id] && rnd.replies[s.id].status === "in" && rnd.replies[s.id].avail.size > 0)
  .map(s => ({ id: s.id, name: s.name, lesson: lessonFor(rnd, s.id), avail: rnd.replies[s.id].avail }));
const getHeat = (rnd) => {
  const h = {};
  Object.values(rnd.replies).forEach(r => { if (r.status !== "in") return; r.avail.forEach(k => { h[k] = (h[k] || 0) + 1; }); });
  return h;
};
const groupByDay = (assign) => {
  const by = {};
  assign.slice().sort((a, b) => a.d - b.d || a.start - b.start).forEach(a => { (by[a.d] = by[a.d] || []).push(a); });
  return by;
};
const dayDateLong = (weekStartISO, d) => {
  const base = new Date(weekStartISO + "T00:00:00");
  base.setDate(base.getDate() + d);
  return base.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
};
const fmtDateShort = (iso) => new Date(iso + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" });

function clearOffer() {
  const rnd = activeRound();
  if (rnd.notTeaching) { rnd.notTeaching = false; S.weeksCompleted = Math.max(0, S.weeksCompleted - 1); }
  rnd.offered = new Set(); rnd.result = null;
  render();
}

function sampleReplies() {
  const rnd = activeRound();
  const next = {};
  S.students.forEach(s => {
    const rand = mulberry(hashStr(s.id + "w" + S.week));
    const need = s.allocated / termWeeks();
    const wants = rand() < Math.min(0.95, need + 0.25);
    if (!wants) { next[s.id] = { status: "skip", avail: new Set(), lesson: 2 }; return; }
    const avail = new Set();
    rnd.offered.forEach(k => { if (rand() < 0.45) avail.add(k); });
    next[s.id] = { status: avail.size ? "in" : "none", avail, lesson: 2 };
  });
  rnd.replies = next; rnd.result = null;
  flash("Sample replies loaded");
  render();
}

function adjustLength(id, delta) {
  const rnd = activeRound();
  const s = S.students.find(x => x.id === id);
  if (!s || !rnd.replies[id]) return;
  const cap = Math.max(1, Math.round((s.allocated - taughtFor(id)) * 2));
  const cur = lessonFor(rnd, id);
  const next = Math.min(4, Math.max(1, cur + delta));
  rnd.replies[id].lesson = Math.min(next, cap);
  rnd.result = null;
  render();
}

function runSolver() {
  const rnd = activeRound();
  if (!rnd.offered.size) { flash("Paint some blocks first"); return; }
  const participants = getParticipants(rnd);
  if (!participants.length) { flash("No students available this week"); return; }
  rnd.result = solve(participants, rnd.offered);
  rnd.chosen = 0; S.tab = "plan";
  render();
}

function buildShareText(assign, weekNoLabel, weekStartISO) {
  const by = groupByDay(assign);
  const heading = (ME.instrument ? ME.instrument + " lessons" : "Lessons") + " — week " + weekNoLabel;
  let out = heading;
  Object.keys(by).sort().forEach(d => {

    by[d].forEach(a => { out += slotTime(a.start) + "–" + slotTime(a.start + a.lesson) + "  " + a.name.split(" ")[0] + "\n"; });

  return out.trim();
}

async function doImage(assign, weekNoLabel, weekStartISO, filenameWeekNo) {
  const by = groupByDay(assign);
  const days = Object.keys(by).sort();
  const rows = assign.length;
  const W = 1000, H = 210 + days.length * 96 + rows * 78 + 110;
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const x = c.getContext("2d");
  const FONT = 'ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif';

  const heading = ME.instrument ? ME.instrument + " lessons" : "Lessons";
  x.fillStyle = "#FBFAF8"; x.fillRect(0, 0, W, H);
  x.fillStyle = "#832222"; x.fillRect(0, 0, W, 12);
  x.fillStyle = "#1B2430"; x.font = "640 46px " + FONT; x.fillText(heading, 64, 108);
  x.fillStyle = "#5A6675"; x.font = "400 28px " + FONT;
  x.fillText((ME.name ? ME.name + " · " : "") + "Week " + weekNoLabel + " of " + termWeeks(), 64, 152);

  let y = 240;
  days.forEach(d => {
    x.fillStyle = "#832222"; x.font = "620 32px " + FONT;
    x.fillText(dayDateLong(weekStartISO, +d), 64, y); y += 46;
    x.strokeStyle = "#DDD8CE"; x.lineWidth = 2;
    x.beginPath(); x.moveTo(64, y - 16); x.lineTo(W - 64, y - 16); x.stroke();

    by[d].forEach(a => {
      x.fillStyle = "#1B2430"; x.font = "500 32px " + FONT;
      x.fillText(slotTime(a.start) + "–" + slotTime(a.start + a.lesson), 64, y + 32);
      x.font = "600 32px " + FONT;
      x.fillText(a.name.split(" ")[0], 360, y + 32);
      x.fillStyle = "#5A6675"; x.font = "400 26px " + FONT; x.textAlign = "right";
      x.fillText(((a.lesson * SLOT_MIN) / 60) + "h", W - 64, y + 32);
      x.textAlign = "left";
      y += 78;
    });
    y += 50;
  });

  x.fillStyle = "#5A6675"; x.font = "400 25px " + FONT;
  x.fillText("Let me know as soon as possible if anything changes.", 64, H - 52);

  const blob = await new Promise(res => c.toBlob(res, "image/png"));
  const file = new File([blob], "lessons-week-" + filenameWeekNo + ".png", { type: "image/png" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: heading }); return; } catch (e) { /* fall through */ }
  }
  if (S.imgUrl) URL.revokeObjectURL(S.imgUrl);
  S.imgUrl = URL.createObjectURL(blob);
  render();
}

function confirmSchedule() {
  const rnd = activeRound();
  const opt = rnd.result && rnd.result.options[rnd.chosen];
  if (!opt) return;
  rnd.plan = {
    weekNo: S.week,
    weekStart: rnd.weekStart,
    lessons: opt.assign.map(a => ({ ...a, key: a.id + "-" + a.d + "-" + a.start, status: "planned" })),
  };
  rnd.result = null; S.imgUrl = ""; S.fallbackText = "";
  flash("Week confirmed — post it to the group");
  render();
}

function setLessonStatus(k, status) {
  const rnd = activeRound();
  rnd.plan.lessons = rnd.plan.lessons.map(l => l.key === k ? { ...l, status } : l);
  S.imgUrl = ""; S.fallbackText = "";
  render();
}

function rescheduleWeek() {
  const rnd = activeRound();
  const staying = rnd.plan.lessons.filter(l => l.status === "planned");
  const pool = staying.map(l => ({
    id: l.id, name: l.name, lesson: l.lesson,
    avail: (rnd.replies[l.id] && rnd.replies[l.id].avail) || new Set(),
  }));
  if (!pool.length) { flash("Nobody left to reschedule"); return; }
  const solved = solve(pool, rnd.offered);
  if (!solved.options.length) { flash("No tighter arrangement available"); return; }
  const fresh = solved.options[0].assign.map(a => ({ ...a, key: a.id + "-" + a.d + "-" + a.start, status: "planned" }));
  rnd.plan.lessons = [...rnd.plan.lessons.filter(l => l.status !== "planned"), ...fresh];
  S.imgUrl = ""; S.fallbackText = "";
  flash("Rescheduled — repost to the group");
  render();
}

function endWeek() {
  const rnd = activeRound();
  if (!rnd.plan) return;
  const { y, m, d } = isoParts(rnd.plan.weekStart);
  const billable = rnd.plan.lessons.filter(l => l.status === "planned" || l.status === "cancelled_late");
  const entries = billable.map(l => {
    const dateISO = new Date(Date.UTC(y, m - 1, d + l.d)).toISOString().slice(0, 10);
    return {
      id: "s" + Date.now() + "-" + l.key, studentId: l.id,
      date: dateISO, hours: (l.lesson * SLOT_MIN) / 60,
      manual: false, lateCancel: l.status === "cancelled_late",
    };
  });
  S.log.push(...entries);
  delete S.rounds[String(S.week)];
  S.weeksCompleted++;
  S.week = Math.min(termWeeks(), S.week + 1);
  ensureRound(S.week);
  S.imgUrl = ""; S.fallbackText = ""; S.tab = "hours";
  flash(entries.length + " lessons logged");
  render();
}

}

/* ================================================================== */
/*  Grid: drag-to-paint (state + one class toggle per cell; no         */
/*  re-render mid-gesture — that's what breaks touch dragging)         */
/* ================================================================== */

function buildGridHTML(role, opts) {
  const { selected, offered, heat, studentId } = opts;
  let head = '<div class="grid-head"><div class="gutter"></div>' + DAYS.map(d => '<div class="dayhead">' + d + '</div>').join("") + "</div>";
  let rows = "";
  for (let i = 0; i < SLOTS; i++) {
    let cells = "";
    for (let d = 0; d < DAYS.length; d++) {
      const k = key(d, i);
      const isOffered = !offered || offered.has(k);
      const on = selected && selected.has(k);
      const h = heat ? (heat[k] || 0) : 0;
      let cls = "cell";
      if (!isOffered) cls += " muted";
      if (on) cls += " on";
      if (h > 0) cls += " heat";
      const style = h > 0 ? ' style="opacity:' + (0.25 + Math.min(h, 4) * 0.18) + '"' : "";
      cells += '<div class="' + cls + '" data-d="' + d + '" data-i="' + i + '"' + style + ">" + (h > 0 ? '<span class="heatnum">' + h + "</span>" : "") + "</div>";
    }
    rows += '<div class="row"><div class="gutter time">' + (i % 2 === 0 ? slotTime(i) : "") + "</div>" + cells + "</div>";
  }
  const attrs = 'data-role="' + role + '"' + (studentId ? ' data-student="' + studentId + '"' : "");
  return '<div class="grid-wrap" ' + attrs + ">" + head + '<div class="grid-body">' + rows + "</div></div>";
}

function cellAt(el, x, y) {
  const at = document.elementFromPoint(x, y);
  const cell = at && at.closest ? at.closest("[data-d]") : null;
  if (!cell || !el.contains(cell)) return null;
  return { d: Number(cell.dataset.d), i: Number(cell.dataset.i), node: cell };
}

let activeEnd = null;
window.addEventListener("mouseup", () => { if (activeEnd) { const fn = activeEnd; activeEnd = null; fn(); } });

function mountPaintGrid(el) {
  const role = el.dataset.role;
  const studentId = el.dataset.student;
  const rnd = activeRound();
  const offeredSet = role === "offer" ? null : rnd.offered;
  let painting = null, last = "";

  const isSelected = (k) => role === "offer" ? rnd.offered.has(k) : !!(rnd.replies[studentId] && rnd.replies[studentId].avail.has(k));

  const apply = (c, val) => {
    const k = key(c.d, c.i);
    if (offeredSet && !offeredSet.has(k)) return;
    if (role === "offer") {
      val ? rnd.offered.add(k) : rnd.offered.delete(k);
    } else {
      if (!rnd.replies[studentId]) rnd.replies[studentId] = { status: "in", avail: new Set(), lesson: 2 };
      val ? rnd.replies[studentId].avail.add(k) : rnd.replies[studentId].avail.delete(k);
      rnd.replies[studentId].status = "in";
    }
    c.node.classList.toggle("on", val);
  };

  const move = (x, y) => {
    if (painting === null) return;
    const c = cellAt(el, x, y);
    if (!c) return;
    const k = key(c.d, c.i);
    if (k === last) return;
    last = k; apply(c, painting);
  };
  const end = () => { if (painting !== null) { painting = null; last = ""; render(); } };

  el.addEventListener("touchstart", (e) => {
    const t = e.touches[0];
    const c = cellAt(el, t.clientX, t.clientY);
    if (!c) return;
    e.preventDefault(); // claim the gesture before the browser starts a scroll
    const k = key(c.d, c.i);
    if (offeredSet && !offeredSet.has(k)) return;
    painting = !isSelected(k); last = k; apply(c, painting);
  }, { passive: false });

  el.addEventListener("touchmove", (e) => {
    if (painting === null) return;
    e.preventDefault();
    const t = e.touches[0];
    move(t.clientX, t.clientY);
  }, { passive: false });

  el.addEventListener("touchend", end);
  el.addEventListener("touchcancel", end);

  el.addEventListener("mousedown", (e) => {
    const c = cellAt(el, e.clientX, e.clientY);
    if (!c) return;
    const k = key(c.d, c.i);
    if (offeredSet && !offeredSet.has(k)) return;
    painting = !isSelected(k); last = k; apply(c, painting);
    activeEnd = end;
  });
  el.addEventListener("mousemove", (e) => { if (e.buttons === 1) move(e.clientX, e.clientY); });
}

  document.querySelectorAll('.grid-wrap[data-role="offer"], .grid-wrap[data-role="reply"]').forEach(mountPaintGrid);

function renderHeader() {

}

// The panel and backdrop live outside #app's innerHTML churn deliberately —
// a freshly-created element has no "before" state, so a CSS transition on
// it never plays. Keeping them as stable elements and just toggling a
// class is what makes the slide and the dim actually animate.
function syncSidebarDOM() {
  const backdrop = document.getElementById("sidebarBackdrop");
  const panel = document.getElementById("sidebarPanel");
  if (!backdrop || !panel) return;
  panel.innerHTML = renderSidebarItems();
  clearTimeout(sidebarCloseTimer);
  if (sidebarOpen) {
    backdrop.hidden = false;
    void backdrop.offsetHeight; // force a layout pass so "open" transitions rather than snapping straight there
    backdrop.classList.add("open");
    panel.classList.add("open");
  } else {
    backdrop.classList.remove("open");
    panel.classList.remove("open");
    sidebarCloseTimer = setTimeout(() => { backdrop.hidden = true; }, 280);
  }
}

function toggleSidebar() { sidebarOpen = !sidebarOpen; syncSidebarDOM(); }
function closeSidebar() { sidebarOpen = false; syncSidebarDOM(); }
function goSection(section) {
  currentSection = section;
  if (section === "termdates") openTermDatesDraft();
  sidebarOpen = false; syncSidebarDOM(); render();
}

    body = '<div class="panel">' + S.students.map(s => {

          "</div></div>";
      }

        const avail = (r && r.avail) || new Set();
        gridBlock = '<div style="padding:4px 0 14px">' + buildGridHTML("reply", { selected: avail, offered: rnd.offered, studentId: s.id }) + "</div>";

function renderPreConfirmPlanTab() {
  const rnd = activeRound();
  if (!rnd.result) {
    return '<div class="pad">' + renderWeekPicker() + '<p class="empty">Nothing solved yet. Collect replies, then tap “Work out the schedule”.</p></div>';
  }
  const r = rnd.result;
  let intro;
  if (r.ok) {
    const days = r.options[0].days;
    intro = '<p class="lede">Everyone fits across <b style="color:var(--ink)">' + days + " day" + (days > 1 ? "s" : "") + "</b>. Pick an arrangement.</p>";
  } else {
    intro = '<p class="lede">Can’t fit everyone.' + (r.unplaced.length ? " Left out: " + r.unplaced.join(", ") + "." : "") + "</p>";
  }

  const optionsHTML = r.options.map((opt, idx) => {
    const daysLabel = [...new Set(opt.assign.map(a => a.d))].sort().map(d => DAYS[d]).join(" + ");
    const gapsLabel = opt.gaps === 0 ? "no gaps" : ((opt.gaps * SLOT_MIN) / 60) + "h idle";
    const lines = opt.assign.slice().sort((a, b) => a.d - b.d || a.start - b.start).map(a =>
      '<div class="line"><span>' + DAYS[a.d] + " " + slotTime(a.start) + "–" + slotTime(a.start + a.lesson) + "</span><span>" + a.name + "</span></div>"
    ).join("");
    return '<div class="opt' + (idx === rnd.chosen ? " sel" : "") + '" data-action="chooseOption" data-idx="' + idx + '">' +
      '<div class="opthead"><b>' + daysLabel + "</b><span>" + gapsLabel + "</span></div>" + lines + "</div>";
  }).join("");

  const alreadyOneDay = r.options.length > 0 && r.options[0].days <= 1;
  const blockersHTML = alreadyOneDay ? "" : '<div class="panel"><h3>If you want it down to one day</h3>' + r.blockers.map(b =>
    '<div class="blocker"><b>' + b.day + "</b> " + (b.blocked.length === 0 ? '<span class="clear">works for everyone</span>' : "works for everyone except " + b.blocked.join(", ")) + "</div>"
  ).join("") + "</div>";

  let sharePanel = "", confirmBtn = "";
  if (r.options.length > 0) {
    sharePanel = '<div class="panel"><h3>Post it to the group</h3>' +
      '<label class="dateline">Week beginning <input type="date" data-bind="weekStart" value="' + rnd.weekStart + '"></label>' +
      '<div class="btnrow" style="margin:12px 0 0">' +
      '<button class="btn" data-action="copyChosen">Copy as text</button>' +
      '<button class="btn" data-action="imageChosen">Make an image</button></div>' +
      (S.fallbackText ? '<textarea class="fallback" readonly rows="' + (S.fallbackText.split("\n").length + 1) + '" onfocus="this.select()">' + escapeHTML(S.fallbackText) + "</textarea>" : "") +
      (S.imgUrl ? '<div class="imgwrap"><img src="' + S.imgUrl + '" alt="Schedule card"><a class="btn" href="' + S.imgUrl + '" download="lessons-week-' + S.week + '.png">Save image</a></div>' : "") +
      "</div>";
    confirmBtn = '<div class="btnrow"><button class="btn sig" data-action="confirmSchedule">Confirm and log hours</button></div>';
  }

  return '<div class="pad">' + renderWeekPicker() + intro + optionsHTML + blockersHTML + sharePanel + confirmBtn + "</div>";
}

function renderLivePlanTab() {
  const rnd = activeRound();
  const plan = rnd.plan;
  const live = plan.lessons.filter(l => l.status === "planned");
  const cancelled = plan.lessons.filter(l => l.status !== "planned");
  const freed = plan.lessons.filter(l => l.status === "cancelled_early");
  const by = groupByDay(live);

  const intro = '<p class="lede">Week ' + plan.weekNo + " is live. " + live.length + " lesson" + (live.length === 1 ? "" : "s") +
    " standing" + (cancelled.length > 0 ? ", " + cancelled.length + " cancelled" : "") + ".</p>";

  const dayPanels = Object.keys(by).sort().map(d => {
    const lessons = by[d].map(l =>
      '<div class="live"><div class="livetop"><b>' + l.name.split(" ")[0] + "</b><span>" + slotTime(l.start) + "–" + slotTime(l.start + l.lesson) + "</span></div>" +
      '<div class="cancels"><button class="mini" data-action="cancelEarly" data-id="' + l.key + '">Cancelled, 24h+ notice</button>' +
      '<button class="mini warnb" data-action="cancelLate" data-id="' + l.key + '">Cancelled late</button></div></div>'
    ).join("");
    return '<div class="panel"><h3>' + dayDateLong(plan.weekStart, +d) + "</h3>" + lessons + "</div>";
  }).join("");

  const emptyMsg = live.length === 0 ? '<p class="empty">Every lesson this week has been cancelled.</p>' : "";

  let cancelledPanel = "";
  if (cancelled.length > 0) {
    cancelledPanel = '<div class="panel"><h3>Cancelled</h3>' + cancelled.map(l =>
      '<div class="entry"><span class="struck">' + DAYS[l.d] + " " + slotTime(l.start) + " · " + l.name.split(" ")[0] +
      '<i class="tag">' + (l.status === "cancelled_late" ? "charged" : "slot freed") + "</i></span>" +
      '<button class="x" data-action="uncancel" data-id="' + l.key + '">↺</button></div>'
    ).join("") + "</div>";
  }

  const actionRow = '<div class="btnrow">' +
    (freed.length > 0 ? '<button class="btn primary" data-action="closeGaps">Close the gaps</button>' : "") +
    '<button class="btn" data-action="copyLive" ' + (live.length ? "" : "disabled") + ">Copy as text</button>" +
    '<button class="btn" data-action="imageLive" ' + (live.length ? "" : "disabled") + ">Make an image</button></div>";

  const fallback = S.fallbackText ? '<textarea class="fallback" readonly rows="' + (S.fallbackText.split("\n").length + 1) + '" onfocus="this.select()">' + escapeHTML(S.fallbackText) + "</textarea>" : "";
  const imgBlock = S.imgUrl ? '<div class="imgwrap"><img src="' + S.imgUrl + '" alt="Schedule card"><a class="btn" href="' + S.imgUrl + '" download="lessons-week-' + plan.weekNo + '.png">Save image</a></div>' : "";
  const endRow = '<div class="btnrow"><button class="btn sig" data-action="endWeek">End week and log hours</button></div>';

  return '<div class="pad">' + renderWeekPicker() + intro + dayPanels + emptyMsg + cancelledPanel + actionRow + fallback + imgBlock + endRow + "</div>";
}

function renderHoursTab() {
  const weeksLeft = Math.max(1, termWeeks() - S.weeksCompleted);
  const totalTaught = S.students.reduce((s, x) => s + taughtFor(x.id), 0);
  const totalAllocated = S.students.reduce((s, x) => s + x.allocated, 0);

  const rows = S.students.map(s => {
    const taught = taughtFor(s.id);
    const remaining = s.allocated - taught;
    const perWeek = remaining / weeksLeft;
    const behind = perWeek > 1.05;
    const pct = Math.min(100, (taught / s.allocated) * 100);
    const lessonsLeft = Math.max(1, Math.round(remaining));
    const entries = S.log.filter(e => e.studentId === s.id).sort((a, b) => (a.date < b.date ? 1 : -1));
    const open = S.openHours === s.id;

    const note = remaining <= 0 ? "Allocation complete"
      : behind ? "Needs " + perWeek.toFixed(1) + "h a week to finish in time"
      : remaining + "h left — roughly " + lessonsLeft + " more hour-long lesson" + (lessonsLeft === 1 ? "" : "s");

    let ledger = "";
    if (open) {
      const entryRows = entries.length === 0 ? '<div class="entry faint">Nothing logged yet</div>' :
        entries.map(e => {
          if (editingEntryId === e.id) {
            return '<div class="entry"><input type="date" data-bind="editDate" value="' + editDraft.date + '" style="flex:1;margin-right:6px">' +
              '<select data-bind="editHours" style="margin-right:6px">' + [0.5, 1, 1.5, 2, 2.5, 3].map(h =>
                '<option value="' + h + '" ' + (parseFloat(editDraft.hours) === h ? "selected" : "") + ">" + h + "h</option>").join("") + "</select>" +
              '<span class="entryright"><button class="btn" style="padding:5px 10px;font-size:12.5px" data-action="saveEditEntry" data-id="' + e.id + '">Save</button>' +
              '<button class="x" data-action="cancelEditEntry">×</button></span></div>';
          }
          return '<div class="entry"><span>' + fmtDateShort(e.date) +
            (e.manual ? '<i class="tag">by hand</i>' : "") + (e.lateCancel ? '<i class="tag">late cancel</i>' : "") + "</span>" +
            '<span class="entryright">' + e.hours + 'h<button class="x" data-action="editEntry" data-id="' + e.id + '" title="Edit">\u270E</button>' +
            '<button class="x" data-action="removeEntry" data-id="' + e.id + '">×</button></span></div>';
        }).join("");
      ledger = '<div class="ledger">' + entryRows +
        '<div class="addrow"><input type="date" data-bind="draftDate" value="' + S.draft.date + '">' +
        '<select data-bind="draftHours">' + [0.5, 1, 1.5, 2, 2.5, 3].map(h =>
          '<option value="' + h + '" ' + (parseFloat(S.draft.hours) === h ? "selected" : "") + ">" + h + "h</option>").join("") + "</select>" +
        '<button class="btn" data-action="addEntry" data-id="' + s.id + '">Add</button></div></div>';
    }

    return '<div class="hrow"><div class="htop" style="cursor:pointer" data-action="toggleHoursOpen" data-id="' + s.id + '">' +
      "<b>" + s.name + "</b><em>" + taught + " / " + s.allocated + "h</em></div>" +
      '<div class="track"><div class="fill' + (behind ? " behind" : "") + '" style="width:' + pct + '%"></div></div>' +
      '<div class="hnote' + (behind ? " warn" : "") + '">' + note + "</div>" + ledger + "</div>";
  }).join("");

  return '<div class="pad"><p class="lede">' + totalTaught + "h taught of " + totalAllocated + "h allocated, with " + weeksLeft +
    ' weeks left. Tap a name to see or add individual lessons.</p><div class="panel">' + rows + "</div>" +
    '<div class="btnrow"><button class="btn' + (confirmingReset ? " confirm-pending" : "") + '" data-action="resetYearConfirm">' +
    (confirmingReset ? "Tap again to confirm" : "Reset year") + '</button></div></div>';
}

document.getElementById("app").addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;

  if (action === "tab") {
    if (confirmingReset) { confirmingReset = false; clearTimeout(resetConfirmTimer); }
    S.tab = el.dataset.tab; render();
  }
  else if (action === "clearOffer") clearOffer();
  else if (action === "skipWeek") skipWeek();
  else if (action === "prevWeek") prevWeek();
  else if (action === "nextWeek") nextWeek();
  else if (action === "goReplies") goReplies();
  else if (action === "toggleSidebar") toggleSidebar();
  else if (action === "saveProfile") saveProfile();
  else if (action === "addStudent") addStudent();
  else if (action === "removeStudent") removeStudent(id);
  else if (action === "saveTermDates") saveTermDates();
  else if (action === "sampleReplies") sampleReplies();
  else if (action === "toggleStudentOpen") { S.openStudent = S.openStudent === id ? null : id; render(); }
  else if (action === "setStatus") {
    const rnd = activeRound();
    const status = el.dataset.status;
    const prevLesson = lessonFor(rnd, id);
    rnd.replies[id] = { status, avail: (rnd.replies[id] && rnd.replies[id].avail) || new Set(), lesson: prevLesson };
    rnd.result = null;
    if (status === "in") S.openStudent = id;
    render();
  }
  else if (action === "adjustLength") adjustLength(id, Number(el.dataset.delta));
  else if (action === "runSolver") runSolver();
  else if (action === "chooseOption") { activeRound().chosen = Number(el.dataset.idx); render(); }
  else if (action === "copyChosen") { const rnd = activeRound(); doCopy(rnd.result.options[rnd.chosen].assign, S.week, rnd.weekStart); }
  else if (action === "imageChosen") { const rnd = activeRound(); doImage(rnd.result.options[rnd.chosen].assign, S.week, rnd.weekStart, S.week); }
  else if (action === "confirmSchedule") confirmSchedule();
  else if (action === "cancelEarly") setLessonStatus(id, "cancelled_early");
  else if (action === "cancelLate") setLessonStatus(id, "cancelled_late");
  else if (action === "uncancel") setLessonStatus(id, "planned");
  else if (action === "closeGaps") rescheduleWeek();
  else if (action === "copyLive") { const rnd = activeRound(); doCopy(rnd.plan.lessons.filter(l => l.status === "planned"), rnd.plan.weekNo, rnd.plan.weekStart); }
  else if (action === "imageLive") { const rnd = activeRound(); doImage(rnd.plan.lessons.filter(l => l.status === "planned"), rnd.plan.weekNo, rnd.plan.weekStart, rnd.plan.weekNo); }
  else if (action === "endWeek") endWeek();
  else if (action === "toggleHoursOpen") { S.openHours = S.openHours === id ? null : id; render(); }
  else if (action === "removeEntry") removeEntry(id);
  else if (action === "editEntry") startEditEntry(id);
  else if (action === "saveEditEntry") saveEditEntry(id);
  else if (action === "cancelEditEntry") cancelEditEntry();
  else if (action === "addEntry") addEntry(id);
  else if (action === "resetYearConfirm") handleResetClick();
});

document.getElementById("app").addEventListener("change", (e) => {
  const el = e.target.closest("[data-bind]");
  if (!el) return;
  const bind = el.dataset.bind;
  if (bind === "weekStart") { activeRound().weekStart = el.value; S.imgUrl = ""; S.fallbackText = ""; render(); }
  else if (bind === "week") {
    let n = parseInt(el.value, 10);
    if (!isFinite(n)) n = S.week;
    S.week = Math.max(1, Math.min(termWeeks(), n));
    ensureRound(S.week);
    S.imgUrl = ""; S.fallbackText = "";
    render();
  }
  else if (bind === "draftDate") { S.draft.date = el.value; }
  else if (bind === "draftHours") { S.draft.hours = el.value; }
  else if (bind === "editDate") { editDraft.date = el.value; }
  else if (bind === "editHours") { editDraft.hours = el.value; }
  else if (bind === "profileName") { ME.name = el.value; }
  else if (bind === "profileInstrument") { ME.instrument = el.value; }
  else if (bind === "studentName") {
    const s = S.students.find(x => x.id === el.dataset.id);
    if (s) s.name = el.value;
  }
  else if (bind === "studentHours") {
    const s = S.students.find(x => x.id === el.dataset.id);
    if (s) s.allocated = Number(el.value) || 0;
  }
  else if (bind === "newStudentName") { newStudentDraft.name = el.value; }
  else if (bind === "newStudentAllocated") { newStudentDraft.allocated = el.value; }
  else if (bind === "termCount") { setTermCount(parseInt(el.value, 10)); }
  else if (bind === "termStart") { termDraft.ranges[Number(el.dataset.idx)].start = el.value; }
  else if (bind === "termEnd") { termDraft.ranges[Number(el.dataset.idx)].end = el.value; }
});

/* ================================================================== */
/*  Boot                                                               */
/* ================================================================== */

document.getElementById("sidebarBackdrop").addEventListener("click", closeSidebar);
document.getElementById("sidebarPanel").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-section]");
  if (btn) goSection(btn.dataset.section);
});
syncSidebarDOM();

render();
Promise.all([loadState(), loadMe()]).then(render);
</script>
</body>
