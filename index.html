<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cadence.</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0}
  html{background:#F2EFE7}
  body{
    --ink:#211C17; --ink-soft:#6B6157; --paper:#F2EFE7; --panel:#FFFFFF;
    --rule:#DCD5C6; --sig:#6E1423; --sig-soft:#EDDEDD; --warn:#96591A;
    --serif: "Source Serif 4", Georgia, serif;
    font-family: "IBM Plex Sans", ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:var(--paper); color:var(--ink);
  }
  *{box-sizing:border-box}
  body{overflow-x:hidden}
  #app{opacity:0;transition:opacity .45s ease}
  #app.revealed{opacity:1}
  .brand-mark{flex:none;width:0.78em;height:0.78em;transform:translateY(0.035em)}
  #brandIntroMark{
    position:fixed;margin:0;padding:0;z-index:100;pointer-events:none;
    display:flex;align-items:center;gap:0.14em;
    font-family:var(--serif);line-height:1;font-weight:700;letter-spacing:-0.025em;
    color:var(--sig);white-space:nowrap;
    text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;
    will-change:transform;
  }
  #brandFooter{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    display:flex;align-items:center;justify-content:center;
    padding:12px 0 14px;
    background:linear-gradient(to top, var(--paper) 55%, transparent);
    opacity:0;transition:opacity .4s ease;pointer-events:none;
  }
  #brandFooterInner{
    display:flex;align-items:center;justify-content:center;gap:0.14em;
    width:max-content;
    font-family:var(--serif);
    font-size:12.5px;
    line-height:1;
    font-weight:700;
    letter-spacing:-0.025em;
    color:var(--ink-soft);
    white-space:nowrap;
    text-rendering:optimizeLegibility;
    -webkit-font-smoothing:antialiased;
    visibility:hidden;
  }
  #brandFooter.revealed{opacity:1}
  @media (prefers-reduced-motion:reduce){
    #brandIntroMark{display:none}
    #app{opacity:1}
    #brandFooter{opacity:1;transition:none}
    #brandFooterInner{visibility:visible}
  }
  .pad{padding:20px 16px 60px}
  h1{font-family:var(--serif);font-size:19px;font-weight:600;margin:0 0 4px}
  .sub{font-size:13px;color:var(--ink-soft);margin:0 0 20px}
  .lede{font-size:14px;line-height:1.5;color:var(--ink-soft);margin:0 0 16px}
  .namebtn{display:block;width:100%;text-align:center;font:inherit;font-size:15px;padding:14px 16px;
           margin-bottom:8px;border-radius:8px;border:1px solid var(--rule);background:var(--panel);
           color:var(--ink);cursor:pointer}
  .namebtn:active{background:var(--paper)}
  .namebtn.replied{background:#F3E1E1;border-color:var(--sig)}
  .replytag{display:block;font-size:12px;color:var(--sig);font-weight:600;margin-top:3px}
  .back{font:inherit;font-size:13px;color:var(--sig);background:none;border:none;padding:0 0 16px;cursor:pointer}
  .choice{display:block;width:100%;text-align:center;font:inherit;font-size:15px;padding:14px 16px;
          margin-bottom:8px;border-radius:8px;border:1px solid var(--rule);background:var(--panel);
          color:var(--ink);cursor:pointer}
  .choice.sel{border-color:var(--sig);background:var(--sig);color:#fff;font-weight:560}
  .grid-wrap{border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--panel);
             touch-action:auto;user-select:none;-webkit-user-select:none;margin:14px 0}
  .grid-head{display:flex;border-bottom:1px solid var(--rule);background:var(--paper)}
  .dayhead{flex:1;text-align:center;padding:8px 0;font-size:12px;font-weight:600;color:var(--ink-soft)}
  .gutter{width:46px;flex:none}
  .row{display:flex;height:25px}
  .row .time{font-size:10.5px;color:var(--ink-soft);padding-right:6px;text-align:right;
             line-height:25px;border-right:1px solid var(--rule)}
  .cell{flex:1;border-right:1px solid #EFECE6;border-bottom:1px solid #EFECE6;cursor:pointer;touch-action:none}
  .cell:last-child{border-right:none}
  .cell.on{background:var(--sig)}
  .cell.muted{background:#EEEAE2;border-right-color:#DDD6C9;border-bottom-color:#DDD6C9;cursor:default;touch-action:pan-y}
  .btn{font:inherit;font-size:14px;padding:12px 18px;border-radius:7px;border:1px solid var(--sig);
       background:var(--sig);color:#fff;font-weight:560;cursor:pointer;width:100%;text-align:center}
  .btn:disabled{opacity:.4;cursor:default}
  .btn-secondary{border-color:var(--rule);background:var(--panel);color:var(--ink)}
  .btn-secondary:disabled{opacity:.4}
  .empty{font-size:14px;color:var(--ink-soft);line-height:1.55}
  .done{font-size:15px;line-height:1.6}
  .count{font-size:13px;color:var(--ink-soft);margin:6px 0 14px}
  .lenrow{display:flex;align-items:center;justify-content:space-between;padding:0 0 16px;font-size:14px;color:var(--ink-soft)}
  .stepper{display:flex;align-items:center;gap:10px}
  .stepper b{font-size:14px;font-weight:600;color:var(--ink);min-width:58px;text-align:center}
  .step{font:inherit;font-size:16px;line-height:1;width:30px;height:30px;border-radius:15px;
        border:1px solid var(--rule);background:var(--panel);color:var(--ink);cursor:pointer}
  .step:disabled{opacity:.32;cursor:default}
  .button-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .button-group .btn{flex:1}
  .confirmation-box{background:var(--sig-soft);border:1px solid var(--sig);border-radius:8px;padding:16px;margin-bottom:16px;text-align:center}
  .confirmation-box .tick{font-size:32px;line-height:1;margin:0 0 8px}
  .confirmation-box .msg{font-size:13px;color:var(--ink);line-height:1.5}
</style>
</head>
<body>
<div id="brandIntroMark" aria-hidden="true">
  <svg class="brand-mark" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
    <rect width="40" height="40" rx="9" fill="#6E1423"/>
    <rect x="8" y="9" width="6" height="22" rx="2" fill="#F2EFE7"/>
    <rect x="20" y="9" width="12" height="22" rx="3" fill="#F2EFE7"/>
  </svg>
  <span>Cadence.</span>
</div>

<div id="app"></div>

<div id="brandFooter">
  <div id="brandFooterInner">
    <svg class="brand-mark" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
      <rect width="40" height="40" rx="9" fill="#6E1423"/>
      <rect x="8" y="9" width="6" height="22" rx="2" fill="#F2EFE7"/>
      <rect x="20" y="9" width="12" height="22" rx="3" fill="#F2EFE7"/>
    </svg>
    <span>Cadence.</span>
  </div>
</div>

<script>
const SLOT_MIN = 30;
const slotTime = (i) => {
  const total = R.startHour * 60 + i * SLOT_MIN;
  const h = Math.floor(total / 60), m = total % 60;
  return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
};
const key = (d, i) => d + "-" + i;

const SLUG_WEEK = (() => {
  const m = window.location.pathname.match(/^\/s\/([^\/]+)\/(\d+)/);
  return m ? { slug: m[1], week: m[2] } : { slug: "", week: "" };
})();
const SLUG = SLUG_WEEK.slug;
const WEEK = SLUG_WEEK.week;

function weekRangeLabel(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-").map(Number);
  const mon = new Date(Date.UTC(y, m - 1, d));
  const fri = new Date(Date.UTC(y, m - 1, d + 4));
  const sameMonth = mon.getUTCMonth() === fri.getUTCMonth() && mon.getUTCFullYear() === fri.getUTCFullYear();
  const monMonth = mon.toLocaleDateString("en-GB", { month: "short", timeZone: "UTC" });
  const friMonth = fri.toLocaleDateString("en-GB", { month: "short", timeZone: "UTC" });
  return sameMonth
    ? mon.getUTCDate() + "\u2013" + fri.getUTCDate() + " " + friMonth + " " + fri.getUTCFullYear()
    : mon.getUTCDate() + " " + monMonth + " \u2013 " + fri.getUTCDate() + " " + friMonth + " " + fri.getUTCFullYear();
}

let R = { loading: true, error: null, weekNo: null, weekStart: null, offered: new Set(), students: [], picked: null, stage: null, avail: new Set(), lesson: 2, submitted: false, submittedStatus: null, submitting: false, days: ["Mon", "Tue", "Wed", "Thu", "Fri"], startHour: 9, slots: 20 };

async function boot() {
  if (!SLUG || !WEEK) {
    R.error = "This link is missing its studio or week code — ask your teacher for the correct link.";
    R.loading = false; render(); return;
  }
  try {
    const res = await fetch("/api/round?slug=" + encodeURIComponent(SLUG) + "&week=" + encodeURIComponent(WEEK));
    const data = await res.json();
    if (!data.teacherName) {
      R.error = "Couldn't find that studio — check the link is correct.";
      R.loading = false; render(); return;
    }
    R.weekNo = data.weekNo;
    R.weekStart = data.weekStart;
    R.offered = new Set(data.offered || []);
    R.students = data.students || [];
    R.teacherName = data.teacherName;
    R.instrument = data.instrument;
    const startHour = data.dayStartHour != null ? data.dayStartHour : 9;
    const endHour = data.dayEndHour != null ? data.dayEndHour : 19;
    R.days = data.includeWeekends ? ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"] : ["Mon", "Tue", "Wed", "Thu", "Fri"];
    R.startHour = startHour;
    R.slots = (endHour - startHour) * 2;
  } catch (e) {
    R.error = "Couldn't reach the schedule — check your connection and reload.";
  }
  R.loading = false;
  render();
}

function pick(id) {
  R.picked = id;
  R.stage = "ask";
  const s = R.students.find(x => x.id === id);
  R.avail = new Set((s && s.avail) || []);
  R.lesson = (s && s.lesson) || 2;
  render();
}
function editAgain() { R.submitted = false; R.stage = "ask"; render(); }
function goGrid() { R.stage = "grid"; render(); }
function back() { R.picked = null; R.stage = null; R.avail = new Set(); render(); }
function done() { R.picked = null; R.stage = null; R.avail = new Set(); R.submitted = false; render(); }
function adjustLesson(delta) {
  R.lesson = Math.min(4, Math.max(1, R.lesson + delta));
  render();
}

async function clearResponse() {
  R.submitting = true; render();
  try {
    await fetch("/api/reply", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ slug: SLUG, week: WEEK, studentId: R.picked, status: "clear", avail: [] }),
    });
    const s = R.students.find(x => x.id === R.picked);
    if (s) { s.status = null; s.avail = []; }
    R.submitted = false;
    R.submittedStatus = null;
    R.picked = null;
    R.stage = null;
    R.avail = new Set();
    R.submitting = false;
  } catch (e) {
    R.submitting = false;
    render();
    alert("Couldn't clear that — check your connection and try again.");
    return;
  }
  render();
}

async function submitStatus(status) {
  R.submitting = true; render();
  try {
    await fetch("/api/reply", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ slug: SLUG, week: WEEK, studentId: R.picked, status, avail: status === "in" ? [...R.avail] : [], lesson: R.lesson }),
    });
    R.submitted = true;
    R.submittedStatus = status;
    const s = R.students.find(x => x.id === R.picked);
    if (s) { s.status = status; s.avail = status === "in" ? [...R.avail] : []; s.lesson = R.lesson; }
    R.submitting = false;
  } catch (e) {
    R.submitting = false;
    render();
    alert("Couldn't save that — check your connection and try again.");
    return;
  }
  render();
}

function buildGridHTML(selected, offered) {
  let head = '<div class="grid-head"><div class="gutter"></div>' + R.days.map(d => '<div class="dayhead">' + d + "</div>").join("") + "</div>";
  let rows = "";
  for (let i = 0; i < R.slots; i++) {
    let cells = "";
    for (let d = 0; d < R.days.length; d++) {
      const k = key(d, i);
      const isOffered = offered.has(k);
      const on = selected.has(k);
      let cls = "cell" + (!isOffered ? " muted" : "") + (on ? " on" : "");
      cells += '<div class="' + cls + '" data-d="' + d + '" data-i="' + i + '"></div>';
    }
    rows += '<div class="row"><div class="gutter time">' + (i % 2 === 0 ? slotTime(i) : "") + "</div>" + cells + "</div>";
  }
  return '<div class="grid-wrap" id="paintGrid">' + head + '<div class="grid-body">' + rows + "</div></div>";
}

function cellAt(el, x, y) {
  const at = document.elementFromPoint(x, y);
  const cell = at && at.closest ? at.closest("[data-d]") : null;
  if (!cell || !el.contains(cell)) return null;
  return { d: Number(cell.dataset.d), i: Number(cell.dataset.i), node: cell };
}

function mountGrid() {
  const el = document.getElementById("paintGrid");
  if (!el) return;
  let painting = null, last = "";
  const apply = (c, val) => {
    const k = key(c.d, c.i);
    if (!R.offered.has(k)) return;
    val ? R.avail.add(k) : R.avail.delete(k);
    c.node.classList.toggle("on", val);
  };
  const move = (x, y) => {
    if (painting === null) return;
    const c = cellAt(el, x, y);
    if (!c) return;
    const k = key(c.d, c.i);
    if (k === last) return;
    last = k; apply(c, painting);
  };
  const end = () => {
    if (painting !== null) { painting = null; last = ""; updateAfterPaint(); }
  };
  el.addEventListener("touchstart", (e) => {
    const t = e.touches[0];
    const c = cellAt(el, t.clientX, t.clientY);
    if (!c) return;
    const k = key(c.d, c.i);
    if (!R.offered.has(k)) return;
    painting = !R.avail.has(k); last = k; apply(c, painting);
  }, { passive: true });
  el.addEventListener("touchmove", (e) => {
    if (painting === null) return;
    const t = e.touches[0];
    move(t.clientX, t.clientY);
  }, { passive: true });
  el.addEventListener("touchend", end);
  el.addEventListener("touchcancel", end);
  el.addEventListener("mousedown", (e) => {
    const c = cellAt(el, e.clientX, e.clientY);
    if (!c) return;
    const k = key(c.d, c.i);
    if (!R.offered.has(k)) return;
    painting = !R.avail.has(k); last = k; apply(c, painting);
    window.__gridMouseUp = end;
  });
  el.addEventListener("mousemove", (e) => { if (e.buttons === 1) move(e.clientX, e.clientY); });
}
window.addEventListener("mouseup", () => { if (window.__gridMouseUp) { const fn = window.__gridMouseUp; window.__gridMouseUp = null; fn(); } });

function updateAfterPaint() {
  const cnt = document.getElementById("slotCount");
  if (cnt) cnt.textContent = R.avail.size + " slot" + (R.avail.size === 1 ? "" : "s") + " selected";
  const btn = document.getElementById("submitBtn");
  if (btn) btn.disabled = R.avail.size === 0;
}

let flashTimer = null;
function flash(msg) {
  console.log(msg);
}

function render() {
  const app = document.getElementById("app");
  const heading = (R.instrument ? R.instrument + " Lessons" : "Lessons") + (R.teacherName ? " — " + R.teacherName : "");
  const weekLabel = "Week " + R.weekNo + (R.weekStart ? " (" + weekRangeLabel(R.weekStart) + ")" : "");

  if (R.loading) { app.innerHTML = '<div class="pad"><p class="lede">Loading…</p></div>'; return; }
  if (R.error) { app.innerHTML = '<div class="pad"><h1>Lessons</h1><p class="empty">' + R.error + "</p></div>"; return; }
  if (!R.offered.size) {
    app.innerHTML = '<div class="pad"><h1>' + heading + '</h1><p class="empty">No lesson times have been posted for this week yet — check back once your teacher sends the link round.</p></div>';
    return;
  }

  if (R.submitted) {
    const name = (R.students.find(s => s.id === R.picked) || {}).name || "";
    const first = name ? name.split(" ")[0] : "";
    const msg = R.submittedStatus === "skip" ? "No lesson needed this week — got it."
      : R.submittedStatus === "none" ? "Thanks for letting us know — your teacher will sort something out."
      : "Got your times for " + weekLabel.toLowerCase() + ".";
    app.innerHTML = '<div class="pad">' +
      '<div class="confirmation-box">' +
      '<div class="tick">\u2713</div>' +
      '<div class="msg">Response recorded</div>' +
      '</div>' +
      '<h1>Thanks' + (first ? ", " + first : "") + '!</h1><p class="done">' + msg + '</p>' +
      '<div class="button-group" style="flex-direction:column">' +
      '<button class="btn" onclick="done()" style="margin-bottom:8px">Done</button>' +
      '<button class="btn btn-secondary" onclick="editAgain()" style="margin-bottom:0">Change answer</button>' +
      '<button class="btn btn-secondary" onclick="clearResponse()" ' + (R.submitting ? "disabled" : "") + '>Clear response</button>' +
      '</div></div>';
    return;
  }

  if (!R.picked) {
    app.innerHTML = '<div class="pad"><h1>' + heading + '</h1><p class="sub">' + weekLabel + ' \u2014 tap your name to give your times.</p>' +
      R.students.map(s => {
        if (s.status) {
          const label = s.status === "in" ? "Times given" : s.status === "skip" ? "Not needed this week" : "None of these worked";
          return '<button class="namebtn replied" onclick="pick(\'' + s.id + '\')">' + s.name +
            '<span class="replytag">\u2713 ' + label + ' \u2014 tap to edit</span></button>';
        }
        return '<button class="namebtn" onclick="pick(\'' + s.id + '\')">' + s.name + "</button>";
      }).join("") +
      "</div>";
    return;
  }

  const name = (R.students.find(s => s.id === R.picked) || {}).name || "";
  const prevStatus = (R.students.find(s => s.id === R.picked) || {}).status || null;

  if (R.stage === "ask") {
    app.innerHTML = '<div class="pad"><button class="back" onclick="back()">← Not ' + name.split(" ")[0] + "?</button>" +
      "<h1>" + name + "</h1><p class=\"sub\">" + weekLabel + '</p>' +
      '<button class="choice' + (prevStatus === "skip" ? " sel" : "") + '" onclick="submitStatus(\'skip\')">Not needed this week</button>' +
      '<button class="choice' + (prevStatus === "in" ? " sel" : "") + '" onclick="goGrid()">Yes, show me the times</button>' +
      "</div>";
    return;
  }

  let body = '<div class="pad"><button class="back" onclick="back()">← Not ' + name.split(" ")[0] + "?</button>" +
    "<h1>" + name + "</h1><p class=\"sub\">" + weekLabel + '</p>' +
    '<div class="lenrow"><span>Lesson length</span><div class="stepper">' +
    '<button class="step" onclick="adjustLesson(-1)" ' + (R.lesson <= 1 ? "disabled" : "") + '>\u2013</button>' +
    "<b>" + (R.lesson * SLOT_MIN) + " min</b>" +
    '<button class="step" onclick="adjustLesson(1)" ' + (R.lesson >= 4 ? "disabled" : "") + '>+</button>' +
    "</div></div>" +
    '<p class="lede">Drag across the times you could do:</p>' +
    buildGridHTML(R.avail, R.offered) +
    '<p class="count" id="slotCount">' + R.avail.size + " slot" + (R.avail.size === 1 ? "" : "s") + " selected</p>" +
    '<button class="choice' + (prevStatus === "none" ? " sel" : "") + '" onclick="submitStatus(\'none\')" ' + (R.submitting ? "disabled" : "") + '>None of these times work</button>' +
    '<button class="btn" id="submitBtn" onclick="submitStatus(\'in\')" ' + (R.avail.size === 0 || R.submitting ? "disabled" : "") + '>' + (R.submitting ? "Saving…" : "Submit") + "</button></div>";

  app.innerHTML = body;
  mountGrid();
}

async function playCadenceIntro() {
  const intro = document.getElementById("brandIntroMark");
  const footer = document.getElementById("brandFooter");
  const footerInner = document.getElementById("brandFooterInner");
  const app = document.getElementById("app");
  if (!intro || !footer || !footerInner || !app) return;

  if (window.matchMedia("(prefers-reduced-motion:reduce)").matches) {
    app.classList.add("revealed");
    footer.classList.add("revealed");
    return;
  }

  try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) {}

  // Render the mark natively at its large starting size — crisp glyph
  // rasterisation — and reach the small final size purely by scaling
  // DOWN via transform. Downscaling stays sharp under GPU compositing;
  // scaling text UP from a small native render looks pixelated, which is
  // why the mark is never laid out at its small final size at all.
  //
  // Only transform and color are ever animated frame-to-frame — both
  // compositor-only properties — since animating left/top/font-size
  // directly forces a layout recalculation on every frame of a
  // fixed-position element, which is what degraded Safari's fixed-
  // position tracking for the rest of the page's life (the original
  // footer-drift bug this replaced).
  const finalStyle = getComputedStyle(footerInner);
  const finalFontSize = parseFloat(finalStyle.fontSize);
  const finalColor = finalStyle.color;
  const startSize = Math.min(72, Math.max(52, window.innerWidth * 0.14));

  intro.style.fontSize = startSize + "px";
  let introRect = intro.getBoundingClientRect();
  intro.style.left = ((window.innerWidth - introRect.width) / 2) + "px";
  intro.style.top = ((window.innerHeight - introRect.height) / 2) + "px";
  introRect = intro.getBoundingClientRect();

  const finalRect = footerInner.getBoundingClientRect();
  const scale = finalFontSize / startSize;
  const dx = (finalRect.left + finalRect.width / 2) - (introRect.left + introRect.width / 2);
  const dy = (finalRect.top + finalRect.height / 2) - (introRect.top + introRect.height / 2);
  const startColor = getComputedStyle(intro).color;

  await new Promise(r => setTimeout(r, 700));

  const animation = intro.animate(
    [
      { transform: "translate(0px, 0px) scale(1)", color: startColor },
      { transform: `translate(${dx}px, ${dy}px) scale(${scale})`, color: finalColor },
    ],
    { duration: 1000, easing: "cubic-bezier(.42,0,.18,1)", fill: "forwards" }
  );
  try { await animation.finished; } catch (e) {}

  // Lock the mark into a plain, resize-invariant resting position rather
  // than leaving it as a frozen top + transform combination. `top` is
  // NOT safe here: if Safari's toolbar later collapses (the viewport
  // growing taller), an element positioned via `top` does not move,
  // while the real page content — and #brandFooter itself, correctly
  // anchored via `bottom:0` — both shift down to fill the new space.
  // That leaves the mark stranded exactly where the OLD, shorter
  // viewport put it, now overlapping whatever content shifted into that
  // spot. `bottom` doesn't have this problem: the browser recalculates
  // it against the CURRENT viewport on every resize, same as
  // #brandFooter's own bottom:0. footerInner's distance from the
  // viewport's bottom edge is constant regardless of toolbar state (it
  // comes entirely from fixed-pixel padding), so measuring it once here
  // stays valid through any later toolbar collapse this code never sees.
  const distanceFromBottom = window.innerHeight - finalRect.bottom;
  intro.style.transform = "";
  intro.style.top = "";
  intro.style.bottom = distanceFromBottom + "px";
  intro.style.left = finalRect.left + "px";
  intro.style.fontSize = finalFontSize + "px";
  intro.style.color = finalColor;

  footer.classList.add("revealed");

  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  app.classList.add("revealed");

  // The travelling mark stays visible forever, exactly where it landed,
  // as the permanent footer wordmark — it is never swapped for the real
  // (permanently invisible) footerInner text or removed. That duplicate
  // text exists solely as a measuring target for finalRect above.
}

boot();
playCadenceIntro();
</script>
</body>
</html>
