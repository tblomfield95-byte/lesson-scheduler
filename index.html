<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cadence.</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0}
  html{background:#F2EFE7}
  body{
    --ink:#211C17; --ink-soft:#6B6157; --paper:#F2EFE7; --panel:#FFFFFF;
    --rule:#DCD5C6; --sig:#6E1423; --sig-soft:#EDDEDD; --warn:#96591A;
    --serif: "Source Serif 4", Georgia, serif;
    font-family: "IBM Plex Sans", ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:var(--paper); color:var(--ink);
  }
  *{box-sizing:border-box}
  body{overflow-x:hidden;-webkit-tap-highlight-color:transparent}
  button,a{-webkit-tap-highlight-color:transparent}
  #app{opacity:0;transition:opacity .45s ease}
  #app.revealed{opacity:1}
  .brand-mark{flex:none;width:0.78em;height:0.78em;transform:translateY(0.035em)}
  #brandIntroMark{
    position:fixed;margin:0;padding:0;z-index:100;pointer-events:none;
    display:flex;align-items:center;gap:0.14em;
    font-family:var(--serif);line-height:1;font-weight:700;letter-spacing:-0.025em;
    color:var(--sig);white-space:nowrap;
    text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;
    will-change:transform;
  }
  #brandFooter{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    display:flex;align-items:center;justify-content:center;
    padding:24px 0 14px;
    background:linear-gradient(to top, var(--paper) 55%, transparent);
    opacity:0;transition:opacity .4s ease;pointer-events:none;
  }
  #brandFooterInner{
    display:flex;align-items:center;justify-content:center;gap:0.14em;
    width:max-content;
    font-family:var(--serif);
    font-size:12.5px;
    line-height:1;
    font-weight:700;
    letter-spacing:-0.025em;
    color:var(--ink-soft);
    white-space:nowrap;
    text-rendering:optimizeLegibility;
    -webkit-font-smoothing:antialiased;
    visibility:hidden;
  }
  #brandFooter.revealed{opacity:1}
  @media (prefers-reduced-motion:reduce){
    #brandIntroMark{display:none}
    #app{opacity:1}
    #brandFooter{opacity:1;transition:none}
    #brandFooterInner{visibility:visible}
  }
  .pad{padding:20px 16px 60px}
  h1{font-family:var(--serif);font-size:19px;font-weight:600;margin:0 0 4px}
  .sub{font-size:13px;color:var(--ink-soft);margin:0 0 20px}
  .lede{font-size:14px;line-height:1.5;color:var(--ink-soft);margin:0 0 16px}
  .namebtn{display:block;width:100%;text-align:center;font:inherit;font-size:15px;padding:14px 16px;
           margin-bottom:8px;border-radius:8px;border:1px solid var(--rule);background:var(--panel);
           color:var(--ink);cursor:pointer}
  .namebtn:active{background:var(--paper)}
  .namebtn.replied{background:var(--sig-soft);border-color:var(--sig)}
  .replytag{display:block;font-size:12px;color:var(--sig);font-weight:600;margin-top:3px}
  .back{font:inherit;font-size:13px;color:var(--sig);background:none;border:none;padding:0 0 16px;cursor:pointer}
  .choice{display:block;width:100%;text-align:center;font:inherit;font-size:15px;padding:14px 16px;
          margin-bottom:8px;border-radius:8px;border:1px solid var(--rule);background:var(--panel);
          color:var(--ink);cursor:pointer}
  .choice.sel{border-color:var(--sig);background:var(--sig);color:#fff;font-weight:560}
  .choice.clear-choice{margin-top:18px;background:transparent;color:var(--sig)}
  .choice:disabled{opacity:.4;cursor:default}
  .grid-wrap{border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--panel);
             touch-action:auto;user-select:none;-webkit-user-select:none;margin:14px 0}
  .grid-head{display:flex;border-bottom:1px solid var(--rule);background:var(--paper)}
  .dayhead{flex:1;text-align:center;padding:8px 0;font-size:12px;font-weight:600;color:var(--ink-soft)}
  .gutter{width:46px;flex:none}
  .row{display:flex;height:25px}
  .row .time{font-size:10.5px;color:var(--ink-soft);padding-right:6px;text-align:right;
             position:relative;border-right:1px solid var(--rule)}
  .row .time span{position:absolute;top:0;right:6px;line-height:1;transform:translateY(-50%);white-space:nowrap}
  .row .time span.first{top:2px;transform:none}
  .cell{flex:1;border-right:1px solid #EFECE6;border-bottom:1px solid #EFECE6;cursor:pointer;touch-action:pinch-zoom}
  .cell:last-child{border-right:none}
  .cell.on{background:var(--sig)}
  .cell.muted{background:#EEEAE2;border-right-color:#DDD6C9;border-bottom-color:#DDD6C9;cursor:default;touch-action:pan-y pinch-zoom}
  .btn{font:inherit;font-size:14px;padding:12px 18px;border-radius:7px;border:1px solid var(--sig);
       background:var(--sig);color:#fff;font-weight:560;cursor:pointer;width:100%;text-align:center}
  .btn:disabled{opacity:.4;cursor:default}
  .btn-secondary{border-color:var(--rule);background:var(--panel);color:var(--ink)}
  .btn-secondary:disabled{opacity:.4}
  .empty{font-size:14px;color:var(--ink-soft);line-height:1.55}
  .done{font-size:15px;line-height:1.6}
  .count{font-size:13px;color:var(--ink-soft);margin:6px 0 14px}
  .lenrow{display:flex;align-items:center;justify-content:space-between;padding:0 0 16px;font-size:14px;color:var(--ink-soft)}
  .stepper{display:flex;align-items:center;gap:10px}
  .stepper b{font-size:14px;font-weight:600;color:var(--ink);min-width:58px;text-align:center}
  .step{font:inherit;font-size:16px;line-height:1;touch-action:manipulation;width:30px;height:30px;border-radius:15px;
        border:1px solid var(--rule);background:var(--panel);color:var(--ink);cursor:pointer;
        transition:transform .12s ease, background-color .12s ease, border-color .12s ease, color .12s ease}
  .step:disabled{opacity:.32;cursor:default}
  .step:active:not(:disabled){transform:scale(.86);background:var(--sig-soft);border-color:var(--sig);color:var(--sig)}
  @media (prefers-reduced-motion:reduce){
    .step{transition:background-color .12s ease, border-color .12s ease, color .12s ease}
    .step:active:not(:disabled){transform:none}
  }
  .button-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .button-group .btn{flex:1}
  .confirmation-box{background:var(--sig-soft);border:1px solid var(--sig);border-radius:8px;padding:16px;margin-bottom:16px;text-align:center}
  .confirmation-box .tick{font-size:32px;line-height:1;margin:0 0 8px}
  .confirmation-box .msg{font-size:13px;color:var(--ink);line-height:1.5}
</style>
</head>
<body>
<div id="brandIntroMark" aria-hidden="true">
  <svg class="brand-mark" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
    <rect width="40" height="40" rx="9" fill="var(--sig)"/>
    <rect x="8" y="9" width="6" height="22" rx="2" fill="#F2EFE7"/>
    <rect x="20" y="9" width="12" height="22" rx="3" fill="#F2EFE7"/>
  </svg>
  <span>Cadence.</span>
</div>

<div id="app"></div>

<div id="brandFooter">
  <div id="brandFooterInner">
    <svg class="brand-mark" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
      <rect width="40" height="40" rx="9" fill="var(--sig)"/>
      <rect x="8" y="9" width="6" height="22" rx="2" fill="#F2EFE7"/>
      <rect x="20" y="9" width="12" height="22" rx="3" fill="#F2EFE7"/>
    </svg>
    <span>Cadence.</span>
  </div>
</div>

<script>
const ACCENT_THEMES = {
  oxblood: { name: "Oxblood", ink: "#6E1423", soft: "#EDDEDD" },
  midnight: { name: "Midnight blue", ink: "#203D64", soft: "#E0E7F0" },
  forest: { name: "Forest green", ink: "#24513D", soft: "#DFEAE2" },
  plum: { name: "Deep plum", ink: "#59345F", soft: "#EBE0ED" },
  slate: { name: "Slate", ink: "#44515F", soft: "#E3E7EB" }
};
function accentTheme(id) {
  return Object.prototype.hasOwnProperty.call(ACCENT_THEMES, id) ? ACCENT_THEMES[id] : ACCENT_THEMES.oxblood;
}
function applyAccent(id) {
  const theme = accentTheme(id);
  document.body.style.setProperty("--sig", theme.ink);
  document.body.style.setProperty("--sig-soft", theme.soft);
}

const SLOT_MIN = 30;
const LESSON_STEP_MIN = 15;
const MIN_LESSON_MINUTES = 30;
const MAX_LESSON_MINUTES = 90;
const slotTime = (i) => {
  const total = R.startHour * 60 + i * SLOT_MIN;
  const h = Math.floor(total / 60), m = total % 60;
  return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
};
const key = (d, i) => d + "-" + i;

const SLUG_WEEK = (() => {
  const m = window.location.pathname.match(/^\/s\/([^\/]+)\/(\d+)/);
  return m ? { slug: m[1], week: m[2] } : { slug: "", week: "" };
})();
const SLUG = SLUG_WEEK.slug;
const PREVIEW = new URLSearchParams(window.location.search).get("preview") === "1";
const WEEK = SLUG_WEEK.week;

function weekRangeLabel(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-").map(Number);
  const mon = new Date(Date.UTC(y, m - 1, d));
  const fri = new Date(Date.UTC(y, m - 1, d + 4));
  const sameMonth = mon.getUTCMonth() === fri.getUTCMonth() && mon.getUTCFullYear() === fri.getUTCFullYear();
  const monMonth = mon.toLocaleDateString("en-GB", { month: "short", timeZone: "UTC" });
  const friMonth = fri.toLocaleDateString("en-GB", { month: "short", timeZone: "UTC" });
  return sameMonth
    ? mon.getUTCDate() + "\u2013" + fri.getUTCDate() + " " + friMonth + " " + fri.getUTCFullYear()
    : mon.getUTCDate() + " " + monMonth + " \u2013 " + fri.getUTCDate() + " " + friMonth + " " + fri.getUTCFullYear();
}

let R = { loading: true, error: null, weekNo: null, weekStart: null, offered: new Set(), students: [], picked: null, stage: null, avail: new Set(), lessonMinutes: 60, submitted: false, submittedStatus: null, submitting: false, days: ["Mon", "Tue", "Wed", "Thu", "Fri"], startHour: 9, slots: 20 };

async function boot() {
  if (!SLUG || !WEEK) {
    R.error = "This link is missing its studio or week code — ask your teacher for the correct link.";
    R.loading = false; render(); return;
  }
  try {
    const res = await fetch("/api/round?slug=" + encodeURIComponent(SLUG) + "&week=" + encodeURIComponent(WEEK));
    if (!res.ok) throw new Error("Couldn't load the schedule");
    const data = await res.json();
    if (!data.teacherName) {
      R.error = "Couldn't find that studio — check the link is correct.";
      R.loading = false; render(); return;
    }
    applyAccent(data.accent);
    R.weekNo = data.weekNo;
    R.weekStart = data.weekStart;
    R.offered = new Set(data.offered || []);
    R.students = data.students || [];
    R.teacherName = data.teacherName;
    R.instrument = data.instrument;
    R.studio = data.studio || "";
    const startHour = data.dayStartHour != null ? data.dayStartHour : 9;
    const endHour = data.dayEndHour != null ? data.dayEndHour : 19;
    R.days = data.includeWeekends ? ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"] : ["Mon", "Tue", "Wed", "Thu", "Fri"];
    R.startHour = startHour;
    R.slots = (endHour - startHour) * 2;
  } catch (e) {
    R.error = "Couldn't reach the schedule — check your connection and reload.";
  }
  R.loading = false;
  render();
}

// Which "depth" of the flow a given state represents, purely to decide
// slide direction — deeper (forward) slides the new screen in from the
// right, shallower (back) slides it in from the left. Same-depth changes
// (adjusting lesson length, the brief "Saving…" state) never call this
// and so never trigger a slide.
function stageDepth() {
  if (R.submitted) return 3;
  if (!R.picked) return 0;
  if (R.stage === "ask") return 1;
  return 2;
}
let __stageDepth = 0;

// A hand-driven slide, the same reliable pattern used throughout the
// admin app: explicitly set the "before" state, force a layout pass, then
// transition to the "after" state — rather than trusting a CSS class to
// animate a full innerHTML swap, which has repeatedly proven unreliable
// elsewhere in this codebase.
async function animatedRender() {
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const newDepth = stageDepth();
  const direction = newDepth === __stageDepth ? 0 : (newDepth > __stageDepth ? 1 : -1);
  __stageDepth = newDepth;

  ensureAppSkeleton();
  const headerEl = document.getElementById("appHeader");
  const bodyEl = document.getElementById("appBody");

  if (!bodyEl.firstChild || direction === 0 || reduceMotion) {
    render();
    return;
  }

  // The ask/grid header (back-link, name, week) is identical between those
  // two stages, so it's only included as a slide target when it's actually
  // about to change — e.g. arriving at or leaving the list/submitted
  // screens, which don't have this header at all.
  const headerChanging = headerEl.innerHTML !== normalizeHTML(computeStudentHeaderHTML());
  const targets = headerChanging ? [headerEl, bodyEl] : [bodyEl];

  const outX = direction > 0 ? "-22px" : "22px";
  const inX = direction > 0 ? "22px" : "-22px";

  targets.forEach((el) => {
    el.style.transition = "transform .2s ease, opacity .2s ease";
    el.style.transform = "translateX(" + outX + ")";
    el.style.opacity = "0";
  });
  await new Promise((r) => setTimeout(r, 200));

  render(); // swap the content while off to the side and invisible

  targets.forEach((el) => {
    el.style.transition = "none";
    el.style.transform = "translateX(" + inX + ")";
  });
  void bodyEl.offsetHeight; // force layout so the transition below starts from this position, not "auto"
  targets.forEach((el) => {
    el.style.transition = "transform .3s cubic-bezier(.22,.72,.16,1), opacity .3s ease";
    el.style.transform = "translateX(0)";
    el.style.opacity = "1";
  });
  await new Promise((r) => setTimeout(r, 300));
  targets.forEach((el) => {
    el.style.transition = "";
    el.style.transform = "";
    el.style.opacity = "";
  });
}

function pick(id) {
  if (R.submitting) return;
  R.picked = id;
  R.stage = "ask";
  const s = R.students.find(x => x.id === id);
  R.avail = new Set((s && s.avail) || []);
  R.lessonMinutes = (s && Number.isInteger(s.lessonMinutes)) ? s.lessonMinutes : ((s && s.lesson) ? s.lesson * SLOT_MIN : 60);
  animatedRender();
}
function editAgain() { if (R.submitting) return; R.submitted = false; R.stage = "ask"; animatedRender(); }
function goGrid() { if (R.submitting) return; R.stage = "grid"; animatedRender(); }
function back() { if (R.submitting) return; R.picked = null; R.stage = null; R.avail = new Set(); animatedRender(); }
function done() { if (R.submitting) return; R.picked = null; R.stage = null; R.avail = new Set(); R.submitted = false; animatedRender(); }
function adjustLesson(delta) {
  if (R.submitting) return;
  R.lessonMinutes = Math.min(MAX_LESSON_MINUTES, Math.max(MIN_LESSON_MINUTES, R.lessonMinutes + delta * LESSON_STEP_MIN));
  render();
}

async function clearResponse() {
  if (PREVIEW) { alert("Preview only — no student replies can be changed."); return; }
  if (R.submitting) return;
  R.submitting = true; render();
  try {
    const response = await fetch("/api/reply", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ slug: SLUG, week: WEEK, studentId: R.picked, status: "clear", avail: [] }),
    });
    const result = await response.json();
    if (!response.ok || !result.ok) throw new Error(result.error || "Clear failed");
    const s = R.students.find(x => x.id === R.picked);
    if (s) { s.status = null; s.avail = []; }
    R.submitted = false;
    R.submittedStatus = null;
    R.picked = null;
    R.stage = null;
    R.avail = new Set();
    R.submitting = false;
  } catch (e) {
    R.submitting = false;
    render();
    alert("Couldn't clear that. " + (e.message || "Check your connection and try again."));
    return;
  }
  animatedRender();
}

async function submitStatus(status) {
  if (PREVIEW) { alert("Preview only — nothing has been submitted."); return; }
  if (R.submitting) return;
  R.submitting = true; render();
  try {
    const response = await fetch("/api/reply", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ slug: SLUG, week: WEEK, studentId: R.picked, status, avail: status === "in" ? [...R.avail] : [], lessonMinutes: R.lessonMinutes }),
    });
    const result = await response.json();
    if (!response.ok || !result.ok) throw new Error(result.error || "Save failed");
    R.submitted = true;
    R.submittedStatus = status;
    const s = R.students.find(x => x.id === R.picked);
    if (s) { s.status = status; s.avail = status === "in" ? [...R.avail] : []; s.lessonMinutes = R.lessonMinutes; }
    R.submitting = false;
  } catch (e) {
    R.submitting = false;
    render();
    alert("Couldn't save that. " + (e.message || "Check your connection and try again."));
    return;
  }
  animatedRender();
}

function buildGridHTML(selected, offered) {
  let head = '<div class="grid-head"><div class="gutter"></div>' + R.days.map(d => '<div class="dayhead">' + d + "</div>").join("") + "</div>";
  let rows = "";
  for (let i = 0; i < R.slots; i++) {
    let cells = "";
    for (let d = 0; d < R.days.length; d++) {
      const k = key(d, i);
      const isOffered = offered.has(k);
      const on = selected.has(k);
      let cls = "cell" + (!isOffered ? " muted" : "") + (on ? " on" : "");
      cells += '<div class="' + cls + '" data-d="' + d + '" data-i="' + i + '"></div>';
    }
    rows += '<div class="row"><div class="gutter time">' + (i % 2 === 0 ? '<span' + (i === 0 ? ' class="first"' : '') + '>' + slotTime(i) + "</span>" : "") + "</div>" + cells + "</div>";
  }
  return '<div class="grid-wrap" id="paintGrid">' + head + '<div class="grid-body">' + rows + "</div></div>";
}

// Safari can still interpret quick taps as a zoom gesture. Cancel only
// a completed single-finger cell tap, never a drag or multi-touch gesture.
function suppressGridDoubleTapZoom(el) {
  let tap = null;
  el.addEventListener("touchstart", (e) => {
    if (e.touches.length !== 1) { tap = null; return; }
    const t = e.touches[0];
    const cell = e.target.closest && e.target.closest(".cell");
    tap = cell && el.contains(cell)
      ? { id: t.identifier, x: t.clientX, y: t.clientY, time: Date.now() }
      : null;
  }, { passive: true, capture: true });
  el.addEventListener("touchmove", (e) => {
    if (!tap) return;
    const t = e.touches[0];
    if (e.touches.length !== 1 || t.identifier !== tap.id ||
        Math.hypot(t.clientX - tap.x, t.clientY - tap.y) > 10) tap = null;
  }, { passive: true, capture: true });
  el.addEventListener("touchend", (e) => {
    const t = Array.from(e.changedTouches).find(t => tap && t.identifier === tap.id);
    if (tap && t && e.touches.length === 0 && Date.now() - tap.time < 500 &&
        Math.hypot(t.clientX - tap.x, t.clientY - tap.y) <= 10 && e.cancelable) {
      e.preventDefault();
    }
    tap = null;
  }, { passive: false, capture: true });
  el.addEventListener("touchcancel", () => { tap = null; }, { passive: true, capture: true });
}

function cellAt(el, x, y) {
  const at = document.elementFromPoint(x, y);
  const cell = at && at.closest ? at.closest("[data-d]") : null;
  if (!cell || !el.contains(cell)) return null;
  return { d: Number(cell.dataset.d), i: Number(cell.dataset.i), node: cell };
}

function mountGrid() {
  const el = document.getElementById("paintGrid");
  if (!el) return;
  suppressGridDoubleTapZoom(el);
  let painting = null, last = "";
  const apply = (c, val) => {
    const k = key(c.d, c.i);
    if (!R.offered.has(k)) return;
    val ? R.avail.add(k) : R.avail.delete(k);
    c.node.classList.toggle("on", val);
  };
  const move = (x, y) => {
    if (painting === null) return;
    const c = cellAt(el, x, y);
    if (!c) return;
    const k = key(c.d, c.i);
    if (k === last) return;
    last = k; apply(c, painting);
  };
  const end = () => {
    if (painting !== null) { painting = null; last = ""; updateAfterPaint(); }
  };
  // A single pointer stream prevents a touch tap being toggled again by
  // the compatibility mouse events that mobile browsers generate.
  let activePointer = null;
  el.addEventListener("pointerdown", (e) => {
    if (activePointer !== null || !e.isPrimary || e.button !== 0) return;
    const c = cellAt(el, e.clientX, e.clientY);
    if (!c) return;
    const k = key(c.d, c.i);
    if (!R.offered.has(k)) return;
    e.preventDefault();
    activePointer = e.pointerId;
    el.setPointerCapture(e.pointerId);
    painting = !R.avail.has(k);
    last = k;
    apply(c, painting);
    updateAfterPaint();
  });
  el.addEventListener("pointermove", (e) => {
    if (e.pointerId !== activePointer) return;
    move(e.clientX, e.clientY);
    updateAfterPaint();
  });
  const finishPointer = (e) => {
    if (e.pointerId !== activePointer) return;
    activePointer = null;
    end();
    if (el.hasPointerCapture(e.pointerId)) el.releasePointerCapture(e.pointerId);
  };
  el.addEventListener("pointerup", finishPointer);
  el.addEventListener("pointercancel", finishPointer);
  el.addEventListener("lostpointercapture", finishPointer);
}

function updateAfterPaint() {
  const cnt = document.getElementById("slotCount");
  if (cnt) cnt.textContent = R.avail.size + " slot" + (R.avail.size === 1 ? "" : "s") + " selected";
  const btn = document.getElementById("submitBtn");
  if (btn) btn.disabled = R.avail.size === 0;
}

let flashTimer = null;
function flash(msg) {
  console.log(msg);
}

// Comparing a hand-built template string directly against element.innerHTML
// is unreliable — the browser re-serializes HTML into its own canonical
// form when you read .innerHTML back (dropping redundant whitespace like
// the stray space left by an empty conditional attribute, for instance),
// so two semantically identical strings can compare as different. Parsing
// the fresh string through a throwaway element first puts both sides
// through the same normalization, so the comparison is apples to apples.
function normalizeHTML(html) {
  const div = document.createElement("div");
  div.innerHTML = html;
  return div.innerHTML;
}

function ensureAppSkeleton() {
  const app = document.getElementById("app");
  if (!document.getElementById("appBody")) {
    app.innerHTML = (PREVIEW ? '<div role="status" style="padding:12px 20px;background:var(--sig);color:white;text-align:center">Student preview · Replies cannot be submitted or cleared.</div>' : '') + '<div id="appHeader"></div><div id="appBody"></div>';
  }
}

// The back-link, student name and week line are identical whether you're
// on the yes/no question or the grid — this is what lets that header stay
// completely still while only the choice buttons vs. the stepper/grid
// slide underneath it.
function computeStudentHeaderHTML() {
  if (R.loading || R.error || !R.offered.size || R.submitted || !R.picked) return "";
  const name = (R.students.find(s => s.id === R.picked) || {}).name || "";
  const weekLabel = "Week " + R.weekNo + (R.weekStart ? " (" + weekRangeLabel(R.weekStart) + ")" : "");
  return '<div class="pad" style="padding-bottom:0"><button class="back" onclick="back()">\u2190 Not ' + name.split(" ")[0] + "?</button>" +
    "<h1>" + name + "</h1><p class=\"sub\">" + weekLabel + "</p></div>";
}

function render() {
  ensureAppSkeleton();
  const safeText = value => String(value).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const heading = safeText((R.instrument ? R.instrument + " Lessons" : "Lessons") + (R.teacherName ? " — " + R.teacherName : "")) + (R.studio ? '<small style="display:block;font-size:0.6em;margin-top:8px">' + safeText(R.studio) + '</small>' : '');
  const weekLabel = "Week " + R.weekNo + (R.weekStart ? " (" + weekRangeLabel(R.weekStart) + ")" : "");
  const headerEl = document.getElementById("appHeader");
  const bodyEl = document.getElementById("appBody");
  const headerHTML = computeStudentHeaderHTML();
  headerEl.innerHTML = headerHTML;
  const bodyPadStyle = headerHTML ? ' style="padding-top:0"' : "";

  if (R.loading) { bodyEl.innerHTML = '<div class="pad"><p class="lede">Loading…</p></div>'; return; }
  if (R.error) { bodyEl.innerHTML = '<div class="pad"><h1>Lessons</h1><p class="empty">' + R.error + "</p></div>"; return; }
  if (!R.offered.size) {
    bodyEl.innerHTML = '<div class="pad"><h1>' + heading + '</h1><p class="empty">No lesson times have been posted for this week yet — check back once your teacher sends the link round.</p></div>';
    return;
  }

  if (R.submitted) {
    const name = (R.students.find(s => s.id === R.picked) || {}).name || "";
    const first = name ? name.split(" ")[0] : "";
    const msg = R.submittedStatus === "skip" ? "No lesson needed this week — got it."
      : R.submittedStatus === "none" ? "Thanks for letting us know — your teacher will sort something out."
      : "Got your times for " + weekLabel.toLowerCase() + ".";
    bodyEl.innerHTML = '<div class="pad">' +
      '<div class="confirmation-box">' +
      '<div class="tick">\u2713</div>' +
      '<div class="msg">Response recorded</div>' +
      '</div>' +
      '<h1>Thanks' + (first ? ", " + first : "") + '!</h1><p class="done">' + msg + '</p>' +
      '<div class="button-group" style="flex-direction:column">' +
      '<button class="btn" onclick="done()" style="margin-bottom:8px">Done</button>' +
      '<button class="btn btn-secondary" onclick="editAgain()" style="margin-bottom:0">Change answer</button>' +
      '<button class="btn btn-secondary" onclick="clearResponse()" ' + (R.submitting ? "disabled" : "") + '>Clear response</button>' +
      '</div></div>';
    return;
  }

  if (!R.picked) {
    bodyEl.innerHTML = '<div class="pad"><h1>' + heading + '</h1><p class="sub">' + weekLabel + ' \u2014 tap your name to give your times.</p>' +
      R.students.map(s => {
        if (s.status) {
          const label = s.status === "in" ? "Times given" : s.status === "skip" ? "Not needed this week" : "None of these worked";
          return '<button class="namebtn replied" onclick="pick(\'' + s.id + '\')">' + s.name +
            '<span class="replytag">\u2713 ' + label + ' \u2014 tap to edit</span></button>';
        }
        return '<button class="namebtn" onclick="pick(\'' + s.id + '\')">' + s.name + "</button>";
      }).join("") +
      "</div>";
    return;
  }

  const prevStatus = (R.students.find(s => s.id === R.picked) || {}).status || null;

  if (R.stage === "ask") {
    bodyEl.innerHTML = '<div class="pad"' + bodyPadStyle + '>' +
      '<button class="choice' + (prevStatus === "skip" ? " sel" : "") + '" onclick="submitStatus(\'skip\')">Not needed this week</button>' +
      '<button class="choice' + (prevStatus === "in" ? " sel" : "") + '" onclick="goGrid()">Yes, show me the times</button>' +
      (prevStatus ? '<button class="choice clear-choice" onclick="clearResponse()" ' + (R.submitting ? "disabled" : "") + '>Clear response</button>' : '') +
      "</div>";
    return;
  }

  let bodyHTML = '<div class="pad"' + bodyPadStyle + '>' +
    '<div class="lenrow"><span>Lesson length</span><div class="stepper">' +
    '<button class="step" onclick="adjustLesson(-1)" ' + (R.lessonMinutes <= MIN_LESSON_MINUTES ? "disabled" : "") + '>\u2013</button>' +
    "<b>" + R.lessonMinutes + " min</b>" +
    '<button class="step" onclick="adjustLesson(1)" ' + (R.lessonMinutes >= MAX_LESSON_MINUTES ? "disabled" : "") + '>+</button>' +
    "</div></div>" +
    '<p class="lede">Drag across the times you could do:</p>' +
    buildGridHTML(R.avail, R.offered) +
    '<p class="count" id="slotCount">' + R.avail.size + " slot" + (R.avail.size === 1 ? "" : "s") + " selected</p>" +
    '<button class="choice' + (prevStatus === "none" ? " sel" : "") + '" onclick="submitStatus(\'none\')" ' + (R.submitting ? "disabled" : "") + '>None of these times work</button>' +
    '<button class="btn" id="submitBtn" onclick="submitStatus(\'in\')" ' + (R.avail.size === 0 || R.submitting ? "disabled" : "") + '>' + (R.submitting ? "Saving…" : "Submit") + "</button></div>";

  bodyEl.innerHTML = bodyHTML;
  mountGrid();
}

async function playCadenceIntro() {
  const intro = document.getElementById("brandIntroMark");
  const footer = document.getElementById("brandFooter");
  const footerInner = document.getElementById("brandFooterInner");
  const app = document.getElementById("app");
  if (!intro || !footer || !footerInner || !app) return;

  if (window.matchMedia("(prefers-reduced-motion:reduce)").matches) {
    app.classList.add("revealed");
    footer.classList.add("revealed");
    return;
  }

  try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) {}

  // Render the mark natively at its large starting size — crisp glyph
  // rasterisation — and reach the small final size purely by scaling
  // DOWN via transform. Downscaling stays sharp under GPU compositing;
  // scaling text UP from a small native render looks pixelated, which is
  // why the mark is never laid out at its small final size at all.
  //
  // Only transform and color are ever animated frame-to-frame — both
  // compositor-only properties — since animating left/top/font-size
  // directly forces a layout recalculation on every frame of a
  // fixed-position element, which is what degraded Safari's fixed-
  // position tracking for the rest of the page's life (the original
  // footer-drift bug this replaced).
  const finalStyle = getComputedStyle(footerInner);
  const finalFontSize = parseFloat(finalStyle.fontSize);
  const finalColor = finalStyle.color;
  const startSize = Math.min(72, Math.max(52, window.innerWidth * 0.14));

  intro.style.fontSize = startSize + "px";
  let introRect = intro.getBoundingClientRect();
  intro.style.left = ((window.innerWidth - introRect.width) / 2) + "px";
  intro.style.top = ((window.innerHeight - introRect.height) / 2) + "px";
  introRect = intro.getBoundingClientRect();

  const finalRect = footerInner.getBoundingClientRect();
  const scale = finalFontSize / startSize;
  const dx = (finalRect.left + finalRect.width / 2) - (introRect.left + introRect.width / 2);
  const dy = (finalRect.top + finalRect.height / 2) - (introRect.top + introRect.height / 2);
  const startColor = getComputedStyle(intro).color;

  await new Promise(r => setTimeout(r, 700));

  const animation = intro.animate(
    [
      { transform: "translate(0px, 0px) scale(1)", color: startColor },
      { transform: `translate(${dx}px, ${dy}px) scale(${scale})`, color: finalColor },
    ],
    { duration: 1000, easing: "cubic-bezier(.42,0,.18,1)", fill: "forwards" }
  );
  try { await animation.finished; } catch (e) {}
  animation.cancel();

  // Keep the SAME rendering technique forever — large native font-size,
  // shrunk only by a constant transform:scale() — rather than switching
  // to a natively-small font-size once landed. That switch was the
  // actual cause of the visible "snap": a large glyph shrunk by the
  // compositor and a small glyph rasterised natively at that size don't
  // render quite identically, so swapping technique right as the
  // animation ends showed up as a jump in weight/shape.
  //
  // `bottom`/`left` (not `top`) keep this correctly placed if Safari's
  // toolbar later changes the viewport height — `bottom` is
  // recalculated live by the browser, the same way #brandFooter's own
  // `bottom:0` is; `top` would stay frozen against whatever viewport
  // existed at this exact moment.
  const distanceFromBottom = window.innerHeight - finalRect.bottom;
  intro.style.top = "";
  intro.style.left = (finalRect.left + finalRect.width / 2 - introRect.width / 2) + "px";
  intro.style.bottom = (distanceFromBottom + (finalRect.height - introRect.height) / 2) + "px";
  intro.style.transform = `scale(${scale})`;
  intro.style.color = finalColor;

  footer.classList.add("revealed");

  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  app.classList.add("revealed");

  // The travelling mark stays visible forever, exactly where it landed,
  // as the permanent footer wordmark — it is never swapped for the real
  // (permanently invisible) footerInner text or removed. That duplicate
  // text exists solely as a measuring target for finalRect above.
}

boot();
playCadenceIntro();
</script>
</body>
</html>
