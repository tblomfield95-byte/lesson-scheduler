<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log in — Cadence.</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Cadence">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0}
  html{background:#F2EFE7}
  body{
    --ink:#211C17;
    --ink-soft:#6B6157;
    --paper:#F2EFE7;
    --panel:#FFFFFF;
    --rule:#DCD5C6;
    --sig:#6E1423;
    --serif:"Source Serif 4",Georgia,serif;
    font-family:"IBM Plex Sans",ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--paper);
    color:var(--ink);
    overflow-x:hidden;
  }
  *{box-sizing:border-box}

  .pad{
    padding:28px 20px;
    max-width:420px;
    margin:0 auto;
  }

  .brand-mark{
    flex:none;
    width:0.78em;
    height:0.78em;
    transform:translateY(0.035em);
  }

  #brandWordmark{
    display:flex;
    align-items:center;
    gap:0.14em;
    font-family:var(--serif);
    font-size:36px;
    line-height:1;
    font-weight:700;
    letter-spacing:-0.025em;
    margin:0 0 6px;
    color:var(--sig);
    opacity:0;
    white-space:nowrap;
    text-rendering:optimizeLegibility;
    -webkit-font-smoothing:antialiased;
  }

  #brandIntro{
    position:fixed;
    inset:0;
    z-index:100;
    pointer-events:none;
  }

  #brandIntroMark{
    position:fixed;
    margin:0;
    padding:0;
    display:flex;
    align-items:center;
    gap:0.14em;
    font-family:var(--serif);
    line-height:1;
    font-weight:700;
    letter-spacing:-0.025em;
    color:var(--sig);
    white-space:nowrap;
    text-rendering:optimizeLegibility;
    -webkit-font-smoothing:antialiased;
    will-change:transform;
  }

  .login-content{
    opacity:0;
    transform:translateY(8px);
    transition:
      opacity .55s ease,
      transform .55s cubic-bezier(.22,.72,.16,1);
  }
  .login-content.revealed{
    opacity:1;
    transform:translateY(0);
  }

  .sub{
    font-size:14px;
    color:var(--ink-soft);
    line-height:1.5;
    margin:0 0 22px;
  }

  input{
    width:100%;
    font:inherit;
    font-size:15px;
    padding:12px 14px;
    border-radius:7px;
    border:1px solid var(--rule);
    background:var(--panel);
    color:var(--ink);
    margin-bottom:12px;
  }

  .btn{
    width:100%;
    font:inherit;
    font-size:15px;
    padding:13px;
    border-radius:7px;
    border:1px solid var(--sig);
    background:var(--sig);
    color:#fff;
    font-weight:600;
    cursor:pointer;
  }

  .btn:disabled{opacity:.5;cursor:default}

  .linkbox{
    margin-top:20px;
    padding:14px;
    border-radius:7px;
    border:1px solid var(--rule);
    background:var(--panel);
    font-size:14px;
    line-height:1.5;
  }

  .linkbox a{
    color:var(--sig);
    font-weight:600;
    word-break:break-all;
  }

  .err{
    color:#96591A;
    font-size:13px;
    margin:-6px 0 12px;
  }

  @media (prefers-reduced-motion:reduce){
    #brandIntro{display:none}
    #brandWordmark{opacity:1}
    .login-content{
      opacity:1;
      transform:none;
      transition:none;
    }
  }
</style>
</head>
<body>

<div id="brandIntro" aria-hidden="true">
  <div id="brandIntroMark">
    <svg class="brand-mark" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
      <rect width="40" height="40" rx="9" fill="#6E1423"/>
      <rect x="8" y="9" width="6" height="22" rx="2" fill="#F2EFE7"/>
      <rect x="20" y="9" width="12" height="22" rx="3" fill="#F2EFE7"/>
    </svg>
    <span>Cadence.</span>
  </div>
</div>

<div class="pad">
  <h1 id="brandWordmark">
    <svg class="brand-mark" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
      <rect width="40" height="40" rx="9" fill="#6E1423"/>
      <rect x="8" y="9" width="6" height="22" rx="2" fill="#F2EFE7"/>
      <rect x="20" y="9" width="12" height="22" rx="3" fill="#F2EFE7"/>
    </svg>
    <span>Cadence.</span>
  </h1>

  <div id="loginContent" class="login-content">
    <p class="sub">Enter your email and we'll email you a link to log in — no password needed.</p>

    <div id="err" role="alert"></div>

    <form id="loginForm">
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
      <button class="btn" id="go" type="submit">Send my link</button>
    </form>

    <div id="result" role="status" aria-live="polite"></div>
  </div>
</div>

<script>
async function playCadenceIntro() {
  const overlay = document.getElementById("brandIntro");
  const intro = document.getElementById("brandIntroMark");
  const finalMark = document.getElementById("brandWordmark");
  const content = document.getElementById("loginContent");

  if (!overlay || !intro || !finalMark || !content) return;

  if (window.matchMedia("(prefers-reduced-motion:reduce)").matches) {
    finalMark.style.opacity = "1";
    content.classList.add("revealed");
    overlay.remove();
    return;
  }

  try {
    if (document.fonts && document.fonts.ready) {
      await document.fonts.ready;
    }
  } catch (e) {}

  /*
    Lay the travelling mark out AT the permanent heading's exact final
    position and size from the start, then use a single transform to make
    it LOOK large and centred higher up the screen. Every frame of the
    animation below only ever touches transform — never left/top/font-size
    — since animating those directly forces a layout recalculation on
    every frame of a fixed-position element, which is what left Safari's
    fixed-position tracking degraded on this page for the address bar's
    entire remaining lifetime (the actual cause of the footer/fixed-bar
    drift bug seen on other pages using this same intro).
  */
  /*
    Render the mark natively at its large starting size — crisp glyph
    rasterisation — and reach the small final size purely by scaling
    DOWN via transform. Downscaling stays sharp under GPU compositing;
    scaling text UP from a small native render looks pixelated, which is
    why the mark is never laid out at its small final size at all.

    Only transform is ever animated frame-to-frame — a compositor-only
    property — since animating left/top/font-size directly forces a
    layout recalculation on every frame of a fixed-position element,
    which is what degraded Safari's fixed-position tracking for the
    rest of a page's life on the pages that keep this mark on screen
    permanently after landing.
  */
  const startSize = Math.min(86, Math.max(64, window.innerWidth * 0.16));
  intro.style.fontSize = startSize + "px";

  let introRect = intro.getBoundingClientRect();
  intro.style.left = ((window.innerWidth - introRect.width) / 2) + "px";
  intro.style.top = (window.innerHeight * 0.42 - introRect.height / 2) + "px";
  introRect = intro.getBoundingClientRect();

  const finalRect = finalMark.getBoundingClientRect();
  const finalFontSize = parseFloat(getComputedStyle(finalMark).fontSize);
  const scale = finalFontSize / startSize;
  const dx = (finalRect.left + finalRect.width / 2) - (introRect.left + introRect.width / 2);
  const dy = (finalRect.top + finalRect.height / 2) - (introRect.top + introRect.height / 2);

  // Deliberate splash hold.
  await new Promise(resolve => setTimeout(resolve, 1900));

  const animation = intro.animate(
    [
      { transform: "translate(0px, 0px) scale(1)" },
      { transform: `translate(${dx}px, ${dy}px) scale(${scale})` }
    ],
    {
      duration:1350,
      easing:"cubic-bezier(.42,0,.18,1)",
      fill:"forwards"
    }
  );

  try {
    await animation.finished;
  } catch (e) {}

  intro.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`;

  // Reveal the real heading underneath at the identical position/size.
  finalMark.style.opacity = "1";

  // Give Safari one complete paint with both marks coincident.
  await new Promise(resolve => requestAnimationFrame(() => {
    requestAnimationFrame(resolve);
  }));

  // Fully remove the overlay (rather than hiding it) so nothing from the
  // animation lingers in a compositing layer for the rest of the page.
  // Safe to remove here (unlike index.html) because the real heading has
  // already been revealed underneath as its permanent replacement.
  overlay.remove();

  // Form arrives only after the wordmark is fully at rest.
  await new Promise(resolve => setTimeout(resolve, 140));
  content.classList.add("revealed");
}

playCadenceIntro();

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const email = document.getElementById("email").value.trim();
  const errEl = document.getElementById("err");
  const resultEl = document.getElementById("result");
  const btn = document.getElementById("go");

  errEl.innerHTML = "";
  resultEl.innerHTML = "";

  if (!email || !email.includes("@")) {
    errEl.innerHTML = '<p class="err">Enter a valid email.</p>';
    return;
  }

  btn.disabled = true;
  btn.textContent = "Sending…";

  try {
    const res = await fetch("/api/login", {
      method:"POST",
      headers:{"content-type":"application/json"},
      body:JSON.stringify({email})
    });

    const data = await res.json();

    if (!res.ok) {
      const message = document.createElement("p");
      message.className = "err";
      message.textContent = data.error || "Something went wrong. Please try again.";
      errEl.replaceChildren(message);
    } else {
      const message = document.createElement("div");
      message.className = "linkbox";
      message.textContent = "Check your inbox — we've sent a login link to " + email +
        ". It expires in 15 minutes. If it doesn't arrive, check your junk folder. You can request another link after a minute.";
      resultEl.replaceChildren(message);
    }
  } catch (e) {
    errEl.innerHTML = '<p class="err">Couldn\u2019t reach the server \u2014 check your connection.</p>';
  }

  btn.disabled = false;
  btn.textContent = "Send my link";
});
</script>

</body>
</html>
