<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Set up your studio — Cadence.</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0}
  body{
    --ink:#211C17; --ink-soft:#6B6157; --paper:#F2EFE7; --panel:#FFFFFF;
    --rule:#DCD5C6; --sig:#6E1423;
    --serif: "Source Serif 4", Georgia, serif;
    font-family: "IBM Plex Sans", ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:var(--paper); color:var(--ink); min-height:100vh;
  }
  *{box-sizing:border-box}
  .pad{padding:24px 18px 60px;max-width:480px;margin:0 auto}
  .brand{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-size:15px;font-weight:600;color:var(--sig);margin:0 0 18px}
  .brand-mark{flex:none;color:var(--sig)}
  h1{font-family:var(--serif);font-size:21px;font-weight:600;margin:0 0 6px}
  .sub{font-size:14px;color:var(--ink-soft);line-height:1.5;margin:0 0 20px}
  label{display:block;font-size:13px;color:var(--ink-soft);margin:0 0 5px}
  input{width:100%;font:inherit;font-size:15px;padding:11px 13px;border-radius:7px;
        border:1px solid var(--rule);background:var(--panel);color:var(--ink);margin-bottom:16px}
  .row{display:flex;gap:8px;align-items:flex-end;margin-bottom:8px}
  .row input{margin-bottom:0}
  .row .name{flex:2}
  .row .hours{flex:1}
  .x{font:inherit;font-size:18px;line-height:1;width:36px;height:44px;border-radius:7px;
     border:1px solid var(--rule);background:var(--panel);color:var(--ink-soft);cursor:pointer;flex:none}
  .add{font:inherit;font-size:13.5px;color:var(--sig);background:none;border:none;padding:4px 0 20px;cursor:pointer}
  .btn{width:100%;font:inherit;font-size:15px;padding:13px;border-radius:7px;border:1px solid var(--sig);
       background:var(--sig);color:#fff;font-weight:560;cursor:pointer}
  .btn:disabled{opacity:.5;cursor:default}
  .err{color:#96591A;font-size:13px;margin:-8px 0 14px}
  h3{font-family:var(--serif);font-size:16px;font-weight:600;margin:26px 0 6px}

  .term-count-card{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    padding:13px 14px;
    margin-bottom:12px;
    border:1px solid var(--rule);
    border-radius:8px;
    background:var(--panel);
  }
  .term-count-card label{
    margin:0;
    font-size:14px;
    font-weight:580;
    color:var(--ink);
  }
  .term-count-card input{
    width:68px;
    margin:0;
    text-align:center;
    padding:9px 8px;
    background:var(--paper);
  }
  .term-card{
    width:100%;
    min-width:0;
    overflow:hidden;
    border:1px solid var(--rule);
    border-radius:12px;
    background:var(--panel);
    padding:14px;
    margin-bottom:12px;
  }
  .term-card-head{margin-bottom:11px}
  .term-card-head h4{
    margin:0;
    font-family:var(--serif);
    font-size:16px;
    font-weight:600;
  }
  .term-date-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:14px;
    width:100%;
    min-width:0;
  }
  .term-date-grid .term-field{
    min-width:0;
    width:100%;
  }
  .term-date-grid label{
    font-size:12.5px;
    margin-bottom:6px;
  }
  .term-date-grid input[type="date"]{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    max-width:100%;
    min-width:0;
    height:44px;
    box-sizing:border-box;
    font:inherit;
    font-size:13.5px;
    line-height:1;
    padding:10px 6px;
    margin:0;
    text-align:center;
    border-radius:7px;
    border:1px solid var(--rule);
    background:var(--paper);
    color:var(--ink);
    -webkit-appearance:none;
    appearance:none;
  }
  @media (max-width:390px){
    .term-card{padding:12px}
    .term-date-grid{gap:10px}
    .term-date-grid input[type="date"]{
      font-size:13px;
      padding-left:4px;
      padding-right:4px;
    }
  }
</style>
</head>
<body>
<div class="pad">
  <p class="brand">
    <svg class="brand-mark" width="14" height="19" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="3" y="3" width="4" height="18" rx="1.5" fill="currentColor"/>
      <rect x="11" y="3" width="9" height="18" rx="2" fill="currentColor"/>
    </svg>
    Cadence.
  </p>
  <h1>Set up your studio</h1>
  <p class="sub">Just once — your name, instrument, and the students you teach with their allocated hours for the year.</p>
  <div id="err"></div>

  <label>Your name</label>
  <input type="text" id="name" placeholder="Jane Smith">
  <label>Instrument</label>
  <input type="text" id="instrument" placeholder="Violin">

  <h3>Students</h3>
  <div id="students"></div>
  <button class="add" id="addStudent">+ Add another student</button>

  <h3>Term dates</h3>
  <p class="sub" style="margin-top:-2px">Used to work out real calendar dates for each week. Reading weeks aren't entered here — mark those "Not teaching" as they come round instead.</p>
  <div class="term-count-card">
    <label for="termCount">Number of terms</label>
    <input type="number" id="termCount" min="1" max="6" value="3">
  </div>
  <div id="terms"></div>

  <button class="btn" id="go">Finish setup</button>
</div>
<script>
let rows = [{ name: "", allocated: "" }];
let terms = [{ start: "", end: "" }, { start: "", end: "" }, { start: "", end: "" }];

function renderRows() {
  const el = document.getElementById("students");
  el.innerHTML = rows.map((r, i) =>
    '<div class="row">' +
    '<input class="name" placeholder="Student name" data-i="' + i + '" data-f="name" value="' + r.name.replace(/"/g, "&quot;") + '">' +
    '<input class="hours" type="number" step="0.5" min="0" placeholder="Hours" data-i="' + i + '" data-f="allocated" value="' + r.allocated + '">' +
    (rows.length > 1 ? '<button class="x" data-remove="' + i + '">\u00d7</button>' : "") +
    "</div>"
  ).join("");
  el.querySelectorAll("input").forEach(inp => {
    inp.addEventListener("input", () => {
      rows[Number(inp.dataset.i)][inp.dataset.f] = inp.value;
    });
  });
  el.querySelectorAll("[data-remove]").forEach(btn => {
    btn.addEventListener("click", () => {
      rows.splice(Number(btn.dataset.remove), 1);
      renderRows();
    });
  });
}
renderRows();

function renderTerms() {
  const el = document.getElementById("terms");
  el.innerHTML = terms.map((t, i) =>
    '<div class="term-card">' +
      '<div class="term-card-head"><h4>Term ' + (i + 1) + '</h4></div>' +
      '<div class="term-date-grid">' +
        '<div class="term-field"><label>Start date</label><input type="date" data-i="' + i + '" data-f="start" value="' + (t.start || "") + '"></div>' +
        '<div class="term-field"><label>End date</label><input type="date" data-i="' + i + '" data-f="end" value="' + (t.end || "") + '"></div>' +
      '</div>' +
    '</div>'
  ).join("");
  el.querySelectorAll("input").forEach(inp => {
    inp.addEventListener("input", () => {
      terms[Number(inp.dataset.i)][inp.dataset.f] = inp.value;
    });
  });
}
renderTerms();

document.getElementById("termCount").addEventListener("input", (e) => {
  let n = parseInt(e.target.value, 10);
  if (!isFinite(n) || n < 1) n = 1;
  if (n > 6) n = 6;
  while (terms.length < n) terms.push({ start: "", end: "" });
  terms.length = n;
  renderTerms();
});

document.getElementById("addStudent").addEventListener("click", () => {
  rows.push({ name: "", allocated: "" });
  renderRows();
});

document.getElementById("go").addEventListener("click", async () => {
  const name = document.getElementById("name").value.trim();
  const instrument = document.getElementById("instrument").value.trim();
  const students = rows.filter(r => r.name.trim());
  const termRanges = terms.filter(t => t.start && t.end);
  const errEl = document.getElementById("err");
  errEl.innerHTML = "";
  if (!name || !instrument || !students.length) {
    errEl.innerHTML = '<p class="err">Fill in your name, instrument, and at least one student.</p>';
    return;
  }
  if (termRanges.length !== terms.length) {
    errEl.innerHTML = '<p class="err">Fill in a start and end date for every term.</p>';
    return;
  }
  const btn = document.getElementById("go");
  btn.disabled = true; btn.textContent = "Setting up…";
  try {
    const res = await fetch("/api/onboarding", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ name, instrument, students, termRanges }),
    });
    const data = await res.json();
    if (!res.ok) { errEl.innerHTML = '<p class="err">' + (data.error || "Something went wrong.") + "</p>"; btn.disabled = false; btn.textContent = "Finish setup"; return; }
    window.location.href = "/admin.html";
  } catch (e) {
    errEl.innerHTML = '<p class="err">Couldn\u2019t reach the server \u2014 check your connection.</p>';
    btn.disabled = false; btn.textContent = "Finish setup";
  }
});
</script>
</body>
</html>
